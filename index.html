const DEFAULT_STUDENTS=[

  ['ياسر بن رمزي العجمي',9,4],['يعقوب بن إسحاق النعماني',5,5],['أسامة بن زهير الكلباني',6,5],
  ['إبراهيم بن نوح المسروري',7,5],['إسماعيل بن ياسين الحبسي',8,5],['بشار بن حكيم الشيباني',9,5],
  ['تمام بن سامي البطاشي',5,6],['ثامر بن سليمان القريني',6,6],['جاسم بن جابر العويسي',7,6],

  ['شادي بن بشير اللواتي',6,7],['صفوان بن رشيد الرحبي',7,7],['طلحة بن زياد الفليتي',8,7],
  ['عبيد بن مبارك الوائلي',9,7]

const DEFAULT_USERS=[
  {id:'U1',name:'مدير المدرسة',title:'مدير'},
  {id:'U2',name:'وكيل المدرسة',title:'وكيل'},
  {id:'U3',name:'الأخصائي الاجتماعي',title:'أخصائي اجتماعي'},
  {id:'U4',name:'مربي الصف الخامس',title:'مربي صف'},
];

const DEFAULT_CONFIG={
  schoolName:'مدرسة المسعى للبنين (٥-٩)',
  ministry:'وزارة التربية والتعليم — سلطنة عُمان',
  logoRight:'',
  logoLeft:'',
  theme:'emerald',
  uiSize:'medium',
  reportTitle:'تقرير مخالفة سلوكية',
  reportFooter:'يُرجى من ولي الأمر التواصل مع إدارة المدرسة لمتابعة الحالة.',
  healthTitle:'نموذج تحويل طالب للوحدة الصحية',
  healthBody:'يُرجى التكرم بفحص الطالب المذكور أعلاه وتزويدنا بالتقرير الطبي.',
  signatures:['توقيع المعلم','توقيع الأخصائي الاجتماعي','توقيع مدير المدرسة']
};

// ========== التخزين ==========
const KEY='almasaa_v4';
function seed(){
  const students=DEFAULT_STUDENTS.map(([name,grade,section],i)=>({
    id:'S'+String(i+1).padStart(3,'0'),name,grade,section,phone:''
  }));
  return {
    config:{...DEFAULT_CONFIG},
    users:[...DEFAULT_USERS],
    students,
    behaviors:[...DEFAULT_BEHAVIORS],
    actions:[...DEFAULT_ACTIONS],
    healthRecords:[],
    records:[],
    resolvedAlerts:[]
  };
}

let DB;
try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):seed();}catch(e){DB=seed();}
// migrations
if(!DB.config.theme)DB.config.theme='emerald';
if(!DB.config.uiSize)DB.config.uiSize='medium';
if(!DB.config.logoRight)DB.config.logoRight='';
if(!DB.config.logoLeft)DB.config.logoLeft='';
if(!DB.healthRecords)DB.healthRecords=[];

function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('تعذر الحفظ: '+e.message)}}
function uid(prefix){return prefix+Date.now()+Math.floor(Math.random()*1000)}

// ========== الثيم والحجم ==========
function applyTheme(){
  const t=THEMES[DB.config.theme]||THEMES.emerald;
  const r=document.documentElement.style;
  r.setProperty('--c-primary',t.primary);
  r.setProperty('--c-primary-light',t.light);
  r.setProperty('--c-primary-dark',t.dark);
  r.setProperty('--c-primary-soft',t.soft);
}
function applySize(){
  document.body.className=document.body.className.replace(/size-\w+/g,'').trim();
  document.body.classList.add('size-'+(DB.config.uiSize||'medium'));
}
applyTheme();applySize();

// ========== أدوات ==========
const fmtDate=t=>new Date(t).toLocaleDateString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit'});
const fmtDateTime=t=>new Date(t).toLocaleString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const timeAgo=t=>{const d=Math.floor((Date.now()-t)/864e5);return d===0?'اليوم':d===1?'أمس':'قبل '+d+' يوم'};
const getStu=id=>DB.students.find(s=>s.id===id);
const getBeh=id=>DB.behaviors.find(b=>b.id===id);
const getAct=id=>DB.actions.find(a=>a.id===id);
const getUser=id=>DB.users.find(u=>u.id===id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayFull=()=>new Date().toLocaleDateString('ar-OM',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function tooltip(text){
  const id='tt'+Math.random().toString(36).slice(2);
  return `<span class="help-icon" onclick="showTooltip(event,'${id}')">?</span>
    <span id="${id}" class="tooltip-box" style="display:none">${esc(text)}</span>`;
}
function showTooltip(ev,id){
  ev.stopPropagation();
  document.querySelectorAll('.tooltip-box').forEach(t=>{if(t.id!==id)t.style.display='none'});
  const el=document.getElementById(id);
  if(!el)return;
  if(el.style.display==='block'){el.style.display='none';return}
  const rect=ev.target.getBoundingClientRect();
  el.style.display='block';
  el.style.position='fixed';
  el.style.top=(rect.bottom+6)+'px';
  el.style.right=(window.innerWidth-rect.right)+'px';
  el.style.left='auto';
  setTimeout(()=>{
    document.addEventListener('click',function h(){el.style.display='none';document.removeEventListener('click',h)});
  },10);
}

function toast(msg,type='ok'){
  let t=document.getElementById('toast');
  if(!t){const d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100';document.body.appendChild(d);t=d}
  t.innerHTML=`<div class="px-5 py-3 rounded-xl font-bold text-sm shadow-lg ${type==='ok'?'bg-primary text-white':'bg-red-600 text-white'}">${msg}</div>`;
  setTimeout(()=>{t.innerHTML=''},2500);
}

// ========== طباعة ==========
function printHTML(html){
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>طباعة</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root{--c-primary:${DB.config.theme?THEMES[DB.config.theme].primary:'#047857'};--c-primary-soft:${DB.config.theme?THEMES[DB.config.theme].soft:'#ECFDF5'}}
      body{font-family:'Cairo',sans-serif;padding:20px;direction:rtl;background:white}
      @media print{@page{margin:1cm}}
    </style></head><body>${html}</body></html>`);
  w.document.close();
  setTimeout(()=>{w.focus();w.print()},900);
}

// ========== واتساب ==========
function openWhatsApp(phone,message){
  if(!phone){toast('لا يوجد رقم ولي أمر مسجل','err');return}
  let clean=String(phone).replace(/\D/g,'');
  if(clean.startsWith('00'))clean=clean.slice(2);
  if(!clean.startsWith('968')&&clean.length<=8)clean='968'+clean;
  const url=`https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
  window.open(url,'_blank');
}

// ========== الحسابات ==========
function computeAlerts(){
  const now=Date.now();
  const in30=DB.records.filter(r=>now-r.createdAt<=30*864e5);
  const cnt={};
  in30.forEach(r=>{cnt[r.studentId]=(cnt[r.studentId]||0)+1});
  const list=[];
  Object.entries(cnt).forEach(([sid,c])=>{
    const s=getStu(sid);if(!s)return;
    if(c>=3)list.push({id:sid+'_30',sid,severity:c>=5?'high':'medium',title:'تكرار المخالفات',msg:`${s.name} (صف ${s.grade}/شعبة ${s.section}) لديه ${c} مخالفة خلال 30 يوماً`});
  });
  return list.filter(a=>!DB.resolvedAlerts.includes(a.id));
}
function stuStats(sid){
  const recs=DB.records.filter(r=>r.studentId===sid);
  return {count:recs.length,points:recs.reduce((s,r)=>s+(r.points||0),0)};
}
function computeAnalytics(){
  const in30=DB.records.filter(r=>Date.now()-r.createdAt<=30*864e5);
  // أكثر السلوكيات
  const behCount={};
  in30.forEach(r=>{const key=r.behaviorName||(getBeh(r.behaviorId)?.name)||'غير معروف';behCount[key]=(behCount[key]||0)+1});
  const topBehaviors=Object.entries(behCount).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count).slice(0,8);
  // أكثر الصفوف
  const gradeCount={};
  in30.forEach(r=>{const s=getStu(r.studentId);if(!s)return;gradeCount[s.grade]=(gradeCount[s.grade]||0)+1});
  const topGrades=GRADES.map(g=>({grade:g,count:gradeCount[g]||0})).sort((a,b)=>b.count-a.count);
  // أكثر الشعب
  const secCount={};
  in30.forEach(r=>{const s=getStu(r.studentId);if(!s)return;secCount[s.section]=(secCount[s.section]||0)+1});
  const topSections=SECTIONS.map(x=>({section:x,count:secCount[x]||0})).sort((a,b)=>b.count-a.count);
  // أكثر الإجراءات
  const actCount={};
  in30.forEach(r=>{const key=r.actionName||(getAct(r.actionId)?.name)||'غير معروف';actCount[key]=(actCount[key]||0)+1});
  const topActions=Object.entries(actCount).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count).slice(0,8);
  return {topBehaviors,topGrades,topSections,topActions,total:in30.length};
}

// ========== القائمة الجانبية ==========
const NAV=[

  {id:'entry',l:'تسجيل مخالفة',i:'✍️'},

function renderNav(){
  document.getElementById('navMenu').innerHTML=NAV.map(n=>{
    const active=currentPage===n.id;
    return `<button data-page="${n.id}" onclick="showPage('${n.id}')" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-sm ${active?'bg-primary text-white':'text-slate-700 hover:bg-primary-soft'}">
      <span>${n.i}</span><span class="flex-1 text-right">${n.l}</span>
      ${n.id==='alerts'&&computeAlerts().length?'<span class="bg-red-600 text-white text-xs rounded-full px-1.5">'+computeAlerts().length+'</span>':''}
    </button>`;
  }).join('');
  document.getElementById('schoolNameSide').textContent=DB.config.schoolName;
  const lb=document.getElementById('sideLogoBox');
  lb.innerHTML=DB.config.logoRight?`<img src="${DB.config.logoRight}" style="width:100%;height:100%;object-fit:contain">`:'<span class="text-amber-400 text-2xl font-black">م</span>';
}

let currentPage='dash';
function showPage(p){
  currentPage=p;
  renderNav();
  if(window.innerWidth<1024)document.getElementById('sidebar').classList.add('translate-x-full');
  render();
}

// ========== لوحة التحكم ==========
function renderDash(){
  const now=Date.now();
  const in30=DB.records.filter(r=>now-r.createdAt<=30*864e5);
  const totalPoints=in30.reduce((s,r)=>s+(r.points||0),0);
  const recent=DB.records.slice(0,6);
  const topStu=[...DB.students].map(s=>({s,...stuStats(s.id)})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,5);
  const a=computeAlerts();
  
  return `<div class="space-y-6">
    <header class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-2xl lg:text-3xl font-black">لوحة التحكم ${tooltip('نظرة شاملة على النشاط السلوكي خلال آخر 30 يوماً')}</h1>
        <p class="text-sm text-slate-500 mt-1">📅 ${todayFull()}</p>
      </div>
      <button onclick="showPage('entry')" class="bg-primary hover:bg-primary-dark text-white font-bold px-5 py-3 rounded-xl shadow">+ تسجيل مخالفة</button>
    </header>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${stat('مخالفات مسجلة',in30.length,'📋','from-slate-700 to-slate-800')}

function onStudentSelect(){
  const sel=document.getElementById('fStudent');
  entryState.sid=sel.value;
  const hb=document.getElementById('healthBanner');
  const health=DB.healthRecords.find(h=>h.studentId===entryState.sid);
  if(health){
    hb.innerHTML=`<div class="mt-3 bg-rose-50 border-r-4 border-rose-500 p-3 rounded-xl">
      <div class="text-xs font-black text-rose-700 mb-1">❤️ تنبيه: الطالب لديه حالة صحية مسجلة</div>
      <div class="text-xs text-rose-800"><b>الحالة:</b> ${esc(health.condition)}</div>
      ${health.notes?`<div class="text-xs text-rose-700 mt-1"><b>ملاحظات:</b> ${esc(health.notes)}</div>`:''}
      <div class="text-[10px] text-rose-500 mt-1">⚠️ هذه المعلومة لا تظهر في التقارير المطبوعة</div>
    </div>`;
  } else hb.innerHTML='';
}

function filterStudents(){
  const q=(document.getElementById('searchName').value||'').trim();
  const g=document.getElementById('searchGrade').value;
  const s=document.getElementById('searchSection').value;
  const filtered=DB.students.filter(st=>{
    if(q&&!st.name.includes(q))return false;
    if(g&&st.grade!==+g)return false;
    if(s&&st.section!==+s)return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  document.getElementById('fStudent').innerHTML=filtered.slice(0,300).map(st=>
    `<option value="${st.id}" ${entryState.sid===st.id?'selected':''}>${esc(st.name)} — صف ${st.grade} / شعبة ${st.section}</option>`
  ).join('')||'<option disabled>لا نتائج</option>';
  if(filtered.length===1){entryState.sid=filtered[0].id;onStudentSelect();}
}

function setAttend(v){entryState.attended=v;updateEntryView();}
function updateEntryView(){
  const ex=document.getElementById('actionExtra');
  if(entryState.aid){
    const a=getAct(entryState.aid);
    if(a&&(a.name.includes('استدعاء')||a.name.includes('فصل')||a.name.includes('تحويل')||a.name.includes('إحالة')||a.name.includes('إشعار'))){
      ex.classList.remove('hidden');
    } else ex.classList.add('hidden');
  } else ex.classList.add('hidden');
  const y=document.getElementById('attYes'),n=document.getElementById('attNo'),na=document.getElementById('attNa');
  if(y){y.className='px-4 py-2 rounded-lg text-xs font-bold border-2 '+(entryState.attended==='yes'?'bg-primary text-white border-primary':'border-slate-200')}
  if(n){n.className='px-4 py-2 rounded-lg text-xs font-bold border-2 '+(entryState.attended==='no'?'bg-red-600 text-white border-red-600':'border-slate-200')}
  if(na){na.className='px-4 py-2 rounded-lg text-xs font-bold border-2 '+(entryState.attended===null?'bg-slate-600 text-white border-slate-600':'border-slate-200')}
}

function saveRecord(){
  if(!entryState.sid){toast('اختر الطالب','err');return}
  if(!entryState.bid){toast('اختر المخالفة','err');return}
  if(!entryState.aid){toast('اختر الإجراء','err');return}
  if(!entryState.uid){toast('اختر المستخدم','err');return}
  const b=getBeh(entryState.bid),a=getAct(entryState.aid),u=getUser(entryState.uid);
  const rec={
    id:uid('R'),
    studentId:entryState.sid,
    behaviorId:entryState.bid,
    behaviorName:b?b.name:'',
    behaviorPoints:b?b.points:0,
    actionId:entryState.aid,
    actionName:a?a.name:'',
    userId:entryState.uid,
    userName:u?u.name:'',
    userTitle:u?u.title:'',
    points:b?b.points:0,
    note:entryState.note,
    attended:entryState.attended,
    actionNote:entryState.actionNote,
    createdAt:Date.now()
  };
  DB.records.unshift(rec);save();
  toast('✓ تم حفظ المخالفة');
  entryState={sid:'',bid:'',aid:'',note:'',uid:'',attended:null,actionNote:''};
  render();
}
function resetEntry(){entryState={sid:'',bid:'',aid:'',note:'',uid:'',attended:null,actionNote:''};render();}

function filterRecords(){
  return DB.records.filter(r=>{
    const s=getStu(r.studentId);if(!s)return false;
    if(recFilters.q){const x=recFilters.q.trim();
      if(!(s.name.includes(x)||(r.behaviorName||'').includes(x)))return false;}
    if(recFilters.grade&&s.grade!==+recFilters.grade)return false;
    if(recFilters.section&&s.section!==+recFilters.section)return false;
    if(recFilters.from){const t=new Date(recFilters.from).getTime();if(r.createdAt<t)return false}
    if(recFilters.to){const t=new Date(recFilters.to).getTime()+864e5;if(r.createdAt>t)return false}
    return true;
  });
}
function deleteRecord(id){if(confirm('حذف السجل؟')){DB.records=DB.records.filter(r=>r.id!==id);save();render();}}

function exportExcel(){
  const rows=[['التاريخ','الطالب','الصف','الشعبة','المخالفة','النقاط','الإجراء','حضور ولي الأمر','ملاحظة الإجراء','المستخدم','ملاحظات']];
  filterRecords().forEach(r=>{const s=getStu(r.studentId);
    rows.push([fmtDate(r.createdAt),s?s.name:'',s?s.grade:'',s?s.section:'',
      r.behaviorName||'',r.points||0,r.actionName||'',
      r.attended==='yes'?'حضر':r.attended==='no'?'لم يحضر':'',r.actionNote||'',r.userName||'',r.note||'']);});
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'المخالفات');
  XLSX.writeFile(wb,'سجل_المخالفات_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function doStuImport(){
  const paste=document.getElementById('pasteArea').value.trim();
  const file=document.getElementById('xlsFile').files[0];
  const replace=document.getElementById('replaceAll').checked;
  const imported=[];
  const parseLine=line=>{
    const parts=line.split(/[,\t،]/).map(x=>x.trim()).filter(x=>x!=='');
    if(parts.length<3)return null;
    const [name,grade,section,phone]=parts;
    const g=parseInt(grade),s=parseInt(section);
    if(!name||isNaN(g)||isNaN(s)||!GRADES.includes(g))return null;
    return {name,grade:g,section:s,phone:phone||''};
  };
  if(paste)paste.split('\n').forEach(line=>{const p=parseLine(line);if(p)imported.push(p)});
  const processFile=rows=>{
    rows.forEach(row=>{
      const [name,grade,section,phone]=row.map(x=>String(x==null?'':x).trim());
      const g=parseInt(grade),s=parseInt(section);
      if(name&&!isNaN(g)&&!isNaN(s)&&GRADES.includes(g))imported.push({name,grade:g,section:s,phone:phone||''});
    });finalize();
  };
  const finalize=()=>{
    if(!imported.length){toast('لم يتم التعرف على أي طالب','err');return}
    if(replace)DB.students=[];
    const existing=new Set(DB.students.map(s=>s.name+'|'+s.grade+'|'+s.section));
    let added=0,skipped=0;
    imported.forEach(p=>{
      const key=p.name+'|'+p.grade+'|'+p.section;
      if(existing.has(key)){skipped++;return}
      existing.add(key);DB.students.push({id:uid('S'),...p});added++;
    });
    save();document.getElementById('modalRoot').innerHTML='';
    toast(`✓ تم إضافة ${added} طالب${skipped?' (تخطي '+skipped+' مكرر)':''}`);render();
  };
  if(file){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        processFile(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
      }catch(err){toast('خطأ في الملف','err')}
    };
    reader.readAsArrayBuffer(file);
  } else finalize();
}

function filterHealthStu(){
  const q=(document.getElementById('hSearch').value||'').trim();
  const g=document.getElementById('hGrade').value;
  const s=document.getElementById('hSection').value;
  const list=DB.students.filter(st=>{
    if(q&&!st.name.includes(q))return false;
    if(g&&st.grade!==+g)return false;
    if(s&&st.section!==+s)return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  document.getElementById('hStudent').innerHTML=list.slice(0,200).map(st=>`<option value="${st.id}">${esc(st.name)} — صف ${st.grade} / شعبة ${st.section}</option>`).join('')||'<option disabled>لا نتائج</option>';
}
function saveHealth(id){
  const sid=document.getElementById('hStudent').value;
  const cond=document.getElementById('hCond').value.trim();
  const notes=document.getElementById('hNotes').value.trim();
  if(!sid||!cond){toast('اختر الطالب وأدخل الحالة','err');return}
  DB.healthRecords.push({id:uid('H'),studentId:sid,condition:cond,notes,createdAt:Date.now()});
  save();document.getElementById('modalRoot').innerHTML='';toast('✓ تم الحفظ');render();
}

function doWhatsappStudentReport(){

  const recs=DB.records.filter(r=>r.studentId===sid).sort((a,b)=>b.createdAt-a.createdAt);

  let msg=`السلام عليكم ورحمة الله وبركاته

إجمالي النقاط: -${total}

تفاصيل آخر المخالفات:
`;
  recs.slice(0,10).forEach((r,i)=>{
    msg+=`\n${i+1}. ${fmtDate(r.createdAt)} - ${r.behaviorName} (-${r.points})\n   الإجراء: ${r.actionName}\n`;

  openWhatsApp(s.phone,msg);

    ${alerts.length===0?`<div class="bg-white rounded-2xl p-12 text-center shadow-sm">
      <div class="text-5xl mb-3">✅</div>
      <div class="font-black text-primary text-lg">لا توجد تنبيهات</div>
    </div>`:
    alerts.map(a=>`<div class="bg-white rounded-2xl p-5 shadow-sm border-r-4 ${a.severity==='high'?'border-red-600':'border-amber-500'}">
      <div class="flex items-start gap-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center text-2xl ${a.severity==='high'?'bg-red-50':'bg-amber-50'}">${a.severity==='high'?'🚨':'⚠️'}</div>
        <div class="flex-1"><div class="font-black">${esc(a.title)}</div>
        <p class="text-sm text-slate-600 mt-1">${esc(a.msg)}</p></div>
        <button onclick="resolveAlert('${a.id}')" class="bg-primary text-white text-xs font-bold px-3 py-2 rounded-lg">✓ معالجة</button>
      </div>
    </div>`).join('')}
  </div>`;
}
function resolveAlert(id){DB.resolvedAlerts.push(id);save();render();}

// ========== الإعدادات ==========
function renderSettings(){
  const currentTheme=DB.config.theme||'emerald';
  const currentSize=DB.config.uiSize||'medium';
  return `<div class="space-y-5 max-w-4xl">
    <header><h1 class="text-2xl lg:text-3xl font-black">⚙️ الإعدادات</h1>
    <p class="text-sm text-slate-500 mt-1">تخصيص كامل للمنصة</p></header>
    
    <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
      <h3 class="font-black">🎨 المظهر والثيم</h3>
      <div>
        <label class="block text-sm font-bold mb-2">لون المنصة</label>
        <div class="grid grid-cols-3 md:grid-cols-6 gap-2">
          ${Object.entries(THEMES).map(([k,t])=>`
            <button onclick="changeTheme('${k}')" class="p-3 rounded-xl border-2 ${currentTheme===k?'border-slate-800':'border-slate-200'} text-center transition">
              <div style="width:100%;height:24px;border-radius:8px;background:${t.primary};margin-bottom:6px"></div>
              <div class="text-[10px] font-bold">${t.name}</div>
            </button>
          `).join('')}
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold mb-2">حجم الواجهة</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="changeSize('small')" class="p-3 rounded-xl border-2 ${currentSize==='small'?'border-primary bg-primary-soft':'border-slate-200'} font-bold text-xs">صغير</button>
          <button onclick="changeSize('medium')" class="p-3 rounded-xl border-2 ${currentSize==='medium'?'border-primary bg-primary-soft':'border-slate-200'} font-bold text-sm">متوسط (مستحسن)</button>
          <button onclick="changeSize('large')" class="p-3 rounded-xl border-2 ${currentSize==='large'?'border-primary bg-primary-soft':'border-slate-200'} font-bold text-base">كبير</button>
        </div>
      </div>
    </div>
    
    <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
      <h3 class="font-black">🏫 هوية المدرسة</h3>
      <div><label class="block text-sm font-bold mb-1">اسم المدرسة</label>
        <input id="sSchool" value="${esc(DB.config.schoolName)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-bold mb-1">السطر الوزاري</label>
        <input id="sMinistry" value="${esc(DB.config.ministry)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1">الشعار الأيمن</label>
          <input type="file" id="sLogoR" accept="image/*" class="text-sm">
          ${DB.config.logoRight?`<div class="mt-2 flex items-center gap-3">
            <img src="${DB.config.logoRight}" style="width:60px;height:60px;object-fit:contain" class="rounded border bg-slate-50 p-1">
            <button onclick="removeLogo('right')" class="text-xs text-red-600 font-bold">حذف</button>
          </div>`:'<p class="text-xs text-slate-500 mt-1">لم يتم الرفع</p>'}
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الشعار الأيسر</label>
          <input type="file" id="sLogoL" accept="image/*" class="text-sm">
          ${DB.config.logoLeft?`<div class="mt-2 flex items-center gap-3">
            <img src="${DB.config.logoLeft}" style="width:60px;height:60px;object-fit:contain" class="rounded border bg-slate-50 p-1">
            <button onclick="removeLogo('left')" class="text-xs text-red-600 font-bold">حذف</button>
          </div>`:'<p class="text-xs text-slate-500 mt-1">لم يتم الرفع</p>'}
        </div>
      </div>
    </div>
    
    <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
      <h3 class="font-black">📄 نصوص الطباعة</h3>
      <div><label class="block text-sm font-bold mb-1">عنوان تقرير المخالفة</label>
        <input id="sReportTitle" value="${esc(DB.config.reportTitle)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-bold mb-1">تذييل التقرير</label>
        <textarea id="sReportFooter" rows="2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${esc(DB.config.reportFooter)}</textarea></div>
      <div><label class="block text-sm font-bold mb-1">عنوان نموذج التحويل الصحي</label>
        <input id="sHealthTitle" value="${esc(DB.config.healthTitle)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-bold mb-1">نص التحويل الصحي</label>
        <textarea id="sHealthBody" rows="2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${esc(DB.config.healthBody)}</textarea></div>
      <div><label class="block text-sm font-bold mb-1">التوقيعات (كل سطر توقيع)</label>
        <textarea id="sSigns" rows="3" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${DB.config.signatures.join('\n')}</textarea></div>
    </div>
    
    <button onclick="saveSettings()" class="w-full bg-primary hover:bg-primary-dark text-white font-black py-3.5 rounded-xl shadow">💾 حفظ الإعدادات</button>
    
    <div class="bg-white rounded-2xl p-6 shadow-sm space-y-3">
      <h3 class="font-black text-red-600">⚠️ إجراءات متقدمة</h3>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportBackup()" class="bg-primary text-white font-bold px-4 py-2 rounded-xl text-sm">📥 تصدير نسخة احتياطية</button>
        <label class="bg-white border-2 border-slate-200 font-bold px-4 py-2 rounded-xl text-sm cursor-pointer">📤 استيراد نسخة<input type="file" accept=".json" onchange="importBackup(this)" class="hidden"></label>
        <button onclick="resetAll()" class="bg-red-50 text-red-600 font-bold px-4 py-2 rounded-xl text-sm">🗑️ إعادة تعيين الكل</button>
      </div>
    </div>
  </div>`;
}
function changeTheme(t){
  DB.config.theme=t;save();applyTheme();
  document.querySelectorAll('.tooltip-box').forEach(e=>e.remove());
  render();
}
function changeSize(s){
  DB.config.uiSize=s;save();applySize();render();
}
function removeLogo(side){
  if(side==='right')DB.config.logoRight='';
  else DB.config.logoLeft='';
  save();renderNav();render();
}
function saveSettings(){
  DB.config.schoolName=document.getElementById('sSchool').value;
  DB.config.ministry=document.getElementById('sMinistry').value;
  DB.config.reportTitle=document.getElementById('sReportTitle').value;
  DB.config.reportFooter=document.getElementById('sReportFooter').value;
  DB.config.healthTitle=document.getElementById('sHealthTitle').value;
  DB.config.healthBody=document.getElementById('sHealthBody').value;
  DB.config.signatures=document.getElementById('sSigns').value.split('\n').map(x=>x.trim()).filter(x=>x);
  const fr=document.getElementById('sLogoR').files[0];
  const fl=document.getElementById('sLogoL').files[0];
  let pending=0;
  const done=()=>{if(pending===0){save();renderNav();toast('✓ تم الحفظ');render();}}
  if(fr){pending++;const r=new FileReader();r.onload=e=>{DB.config.logoRight=e.target.result;pending--;done()};r.readAsDataURL(fr);}
  if(fl){pending++;const r=new FileReader();r.onload=e=>{DB.config.logoLeft=e.target.result;pending--;done()};r.readAsDataURL(fl);}
  if(pending===0){save();renderNav();toast('✓ تم الحفظ');render();}
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{DB=JSON.parse(e.target.result);save();applyTheme();applySize();renderNav();toast('✓ تم الاستيراد');render();}catch(err){toast('ملف غير صالح','err')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('سيتم حذف كل البيانات نهائياً. متأكد؟'))return;
  if(!confirm('تأكيد أخير؟'))return;
  localStorage.removeItem(KEY);DB=seed();save();applyTheme();applySize();renderNav();render();
}

// ========== الرئيسية ==========
function render(){
  const el=document.getElementById('content');
  const maps={
    dash:renderDash,
    entry:renderEntry,
    records:renderRecords,
    analytics:renderAnalytics,
    students:renderStudents,
    health:renderHealth,
    healthTransfer:renderHealthTransfer,
    users:renderUsers,
    behaviors:renderBehaviors,
    actions:renderActions,
    reports:renderReports,
    alerts:renderAlerts,
    settings:renderSettings
  };
  el.innerHTML=(maps[currentPage]||renderDash)();
  if(currentPage==='entry'){filterStudents();updateEntryView();onStudentSelect();}
  if(currentPage==='healthTransfer'){filterHtStu();}
  window.scrollTo(0,0);
}

// ========== بدء ==========
renderNav();
showPage('dash');
</script>
</body>
</html>
