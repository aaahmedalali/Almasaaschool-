<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{font-family:'Cairo',sans-serif;background:#F8FAFC;margin:0}

<body>

<div class="min-h-screen flex flex-row-reverse">
<aside id="sidebar" class="fixed lg:static top-0 right-0 h-screen w-72 bg-white border-l border-slate-200 z-40 transform translate-x-full lg:translate-x-0 transition-transform flex flex-col overflow-y-auto">
  <div class="p-4 border-b flex items-center gap-3">
    <div id="logoBox" class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-700 to-emerald-900 flex items-center justify-center flex-shrink-0 overflow-hidden">

    </div>
    <div class="flex-1 min-w-0">
      <div id="schoolNameSide" class="font-black text-emerald-700 text-sm leading-tight">مدرسة المسعى للبنين (٥-٩)</div>

  </div>

</aside>

<main class="flex-1 overflow-x-hidden">
  <button onclick="document.getElementById('sidebar').classList.toggle('translate-x-full')" class="lg:hidden fixed top-4 right-4 z-50 bg-emerald-700 text-white p-3 rounded-xl shadow-lg no-print">☰</button>
  <div id="content" class="p-4 lg:p-8 pt-20 lg:pt-8"></div>
</main>
</div>

<div id="modalRoot"></div>

<script>
// ========== الثوابت الافتراضية ==========
const GRADES=[5,6,7,8,9];
const SECTIONS=[1,2,3,4,5,6,7];

const DEFAULT_BEHAVIORS=[
  {id:'B1',name:'تأخر عن الحصة',points:1,active:true},
  {id:'B2',name:'عدم إحضار الكتب والأدوات',points:1,active:true},
  {id:'B3',name:'إزعاج الصف وتشويش النظام',points:2,active:true},
  {id:'B4',name:'التلفظ بألفاظ غير لائقة',points:3,active:true},
  {id:'B5',name:'التخلف عن الطابور الصباحي',points:1,active:true},
  {id:'B6',name:'مشاجرة مع زميل',points:4,active:true},
  {id:'B7',name:'إتلاف ممتلكات المدرسة',points:5,active:true},
  {id:'B8',name:'الغياب بدون عذر مقبول',points:2,active:true},
  {id:'B9',name:'استخدام الهاتف داخل الصف',points:2,active:true},
  {id:'B10',name:'عدم تنفيذ توجيهات المعلم',points:2,active:true},
  {id:'B11',name:'الهروب من الحصة',points:3,active:true},
  {id:'B12',name:'التنمر على زميل',points:5,active:true}
];

const DEFAULT_ACTIONS=[
  {id:'A1',name:'تنبيه شفهي',desc:'تنبيه الطالب شفهياً من قبل المعلم'},
  {id:'A2',name:'إشعار ولي الأمر',desc:'إبلاغ ولي الأمر هاتفياً أو برسالة نصية'},
  {id:'A3',name:'استدعاء ولي الأمر',desc:'حضور ولي الأمر للمدرسة لمقابلة الإدارة'},
  {id:'A4',name:'تحويل للوحدة الصحية',desc:'تحويل الطالب للوحدة الصحية للفحص'},
  {id:'A5',name:'فصل مؤقت (يوم)',desc:'فصل الطالب مؤقتاً عن المدرسة ليوم واحد'},
  {id:'A6',name:'فصل مؤقت (٣ أيام)',desc:'فصل الطالب مؤقتاً ثلاثة أيام مع إشعار ولي الأمر'},
  {id:'A7',name:'إحالة إلى لجنة السلوك',desc:'إحالة الحالة إلى لجنة السلوك بالمدرسة'}
];

const DEFAULT_STUDENTS=[
  ['أحمد بن سالم الرواحي',5,1],['محمد بن خالد البلوشي',5,1],['يوسف بن علي المعمري',5,2],
  ['عبدالله بن حمد الحارثي',5,2],['سعيد بن راشد الكندي',5,3],['خالد بن ناصر الفارسي',6,1],
  ['سلطان بن ماجد الشكيلي',6,1],['حمزة بن ياسر العامري',6,2],['طلال بن سعيد الهنائي',6,2],
  ['فهد بن عبدالرحمن الزدجالي',6,3],['بدر بن سليمان الريامي',7,1],['مازن بن حمدان الحجري',7,1],
  ['معاذ بن طارق السعدي',7,2],['أيمن بن وليد المقبالي',7,2],['راشد بن سيف الخروصي',7,3],
  ['هلال بن منصور الغافري',8,1],['نبيل بن عامر الحوسني',8,1],['قيس بن مروان الوهيبي',8,2],
  ['زياد بن فارس اليعقوبي',8,2],['مروان بن أيمن السيابي',8,3],['حاتم بن صالح العبري',9,1],
  ['عمار بن نبيل الجابري',9,1],['أنس بن كمال الرئيسي',9,2],['بلال بن هيثم المخيني',9,2],
  ['جعفر بن عادل الشعيلي',9,3],['كرم بن رامي الصوافي',9,3],['ليث بن جابر الحسني',5,4],
  ['مصعب بن أنور البوسعيدي',6,4],['نزار بن صقر الهاشمي',7,4],['وسام بن فاروق الأغبري',8,4],
  ['ياسر بن رمزي العجمي',9,4],['يعقوب بن إسحاق النعماني',5,5],['أسامة بن زهير الكلباني',6,5],
  ['إبراهيم بن نوح المسروري',7,5],['إسماعيل بن ياسين الحبسي',8,5],['بشار بن حكيم الشيباني',9,5],
  ['تمام بن سامي البطاشي',5,6],['ثامر بن سليمان القريني',6,6],['جاسم بن جابر العويسي',7,6],
  ['حسام بن لؤي المزروعي',8,6],['رشيد بن عامر البلوشي',9,6],['سامر بن منير الحديدي',5,7],
  ['شادي بن بشير اللواتي',6,7],['صفوان بن رشيد الرحبي',7,7],['طلحة بن زياد الفليتي',8,7],
  ['عبيد بن مبارك الوائلي',9,7]
];

const DEFAULT_USERS=[
  {id:'U1',name:'مدير المدرسة',title:'مدير'},
  {id:'U2',name:'وكيل المدرسة',title:'وكيل'},
  {id:'U3',name:'الأخصائي الاجتماعي',title:'أخصائي اجتماعي'},
  {id:'U4',name:'مربي الصف الخامس',title:'مربي صف'},
];

const DEFAULT_CONFIG={
  schoolName:'مدرسة المسعى للبنين (٥-٩)',
  ministry:'وزارة التربية والتعليم — سلطنة عُمان',
  logo:'',
  reportTitle:'تقرير مخالفة سلوكية',
  reportFooter:'يُرجى من ولي الأمر التواصل مع إدارة المدرسة لمتابعة الحالة.',
  healthTitle:'نموذج تحويل طالب للوحدة الصحية',
  healthBody:'يُرجى التكرم بفحص الطالب المذكور أعلاه وتزويدنا بالتقرير الطبي.',
  signatures:['توقيع المعلم','توقيع الأخصائي الاجتماعي','توقيع مدير المدرسة']
};

// ========== التخزين ==========
const KEY='almasaa_v3';

function seed(){
  const students=DEFAULT_STUDENTS.map(([name,grade,section],i)=>({
    id:'S'+String(i+1).padStart(3,'0'),name,grade,section,phone:''
  }));
  return {
    config:{...DEFAULT_CONFIG},
    users:[...DEFAULT_USERS],
    students,
    behaviors:[...DEFAULT_BEHAVIORS],
    actions:[...DEFAULT_ACTIONS],
    records:[],
    resolvedAlerts:[]
  };
}

let DB;
try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):seed();}catch(e){DB=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('تعذر الحفظ: '+e.message)}}
function uid(prefix){return prefix+Date.now()+Math.floor(Math.random()*1000)}

// ========== أدوات ==========
const fmtDate=t=>new Date(t).toLocaleDateString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit'});
const fmtDateTime=t=>new Date(t).toLocaleString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const timeAgo=t=>{const d=Math.floor((Date.now()-t)/864e5);return d===0?'اليوم':d===1?'أمس':'قبل '+d+' يوم'};
const getStu=id=>DB.students.find(s=>s.id===id);
const getBeh=id=>DB.behaviors.find(b=>b.id===id);
const getAct=id=>DB.actions.find(a=>a.id===id);
const getUser=id=>DB.users.find(u=>u.id===id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ========== القائمة الجانبية ==========
const NAV=[
  {id:'dash',l:'لوحة التحكم',i:'📊'},
  {id:'entry',l:'تسجيل مخالفة',i:'✍️'},
  {id:'records',l:'سجل المخالفات',i:'📋'},
  {id:'students',l:'إدارة الطلبة',i:'👥'},
  {id:'users',l:'إدارة المستخدمين',i:'👤'},
  {id:'behaviors',l:'إدارة المخالفات',i:'⚠️'},
  {id:'actions',l:'إدارة الإجراءات',i:'🎯'},
  {id:'reports',l:'التقارير الرسمية',i:'📄'},
  {id:'alerts',l:'التنبيهات',i:'🔔'},
  {id:'settings',l:'الإعدادات',i:'⚙️'}
];

function renderNav(){
  const el=document.getElementById('navMenu');
  el.innerHTML=NAV.map(n=>{
    const active=currentPage===n.id;
    return `<button data-page="${n.id}" onclick="showPage('${n.id}')" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-sm ${active?'bg-emerald-700 text-white':'text-slate-700 hover:bg-emerald-50'}">
      <span>${n.i}</span><span class="flex-1 text-right">${n.l}</span>
      ${n.id==='alerts'&&computeAlerts().length?'<span class="bg-red-600 text-white text-xs rounded-full px-1.5">'+computeAlerts().length+'</span>':''}
    </button>`;
  }).join('');
  document.getElementById('schoolNameSide').textContent=DB.config.schoolName;
  // شعار
  const lb=document.getElementById('logoBox');
  if(DB.config.logo)lb.innerHTML=`<img src="${DB.config.logo}" class="w-full h-full object-cover">`;
}

// ========== التنقل ==========
let currentPage='dash';
function showPage(p){
  currentPage=p;
  renderNav();
  if(window.innerWidth<1024)document.getElementById('sidebar').classList.add('translate-x-full');
  render();
}

// ========== الحسابات ==========
function computeAlerts(){
  const now=Date.now();
  const in30=DB.records.filter(r=>now-r.createdAt<=30*864e5);
  const cnt={};
  in30.forEach(r=>{cnt[r.studentId]=(cnt[r.studentId]||0)+1});
  const list=[];
  Object.entries(cnt).forEach(([sid,c])=>{
    const s=getStu(sid);if(!s)return;
    if(c>=3)list.push({id:sid+'_30',sid,severity:c>=5?'high':'medium',title:'تكرار المخالفات',msg:`${s.name} (الصف ${s.grade}/${s.section}) لديه ${c} مخالفة خلال 30 يوماً`});
  });
  return list.filter(a=>!DB.resolvedAlerts.includes(a.id));
}

function stuStats(sid){
  const recs=DB.records.filter(r=>r.studentId===sid);
  const points=recs.reduce((s,r)=>s+(r.points||0),0);
  return {count:recs.length,points};
}

// ========== التنبيهات ==========
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  if(!t){const d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100';document.body.appendChild(d);return toast(msg,type)}
  t.innerHTML=`<div class="px-5 py-3 rounded-xl font-bold text-sm shadow-lg ${type==='ok'?'bg-emerald-600 text-white':'bg-red-600 text-white'}">${msg}</div>`;
  setTimeout(()=>{t.innerHTML=''},2500);
}

// ========== الطباعة ==========
function printHTML(html){
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>طباعة</title><script src="https://cdn.tailwindcss.com"><\/script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><style>body{font-family:'Cairo',sans-serif;padding:20px;direction:rtl}@media print{@page{margin:1cm}}</style></head><body>${html}</body></html>`);
  w.document.close();
  setTimeout(()=>{w.focus();w.print()},800);
}

// ========== صفحة لوحة التحكم ==========
function renderDash(){
  const now=Date.now();
  const in30=DB.records.filter(r=>now-r.createdAt<=30*864e5);
  const totalPoints=in30.reduce((s,r)=>s+(r.points||0),0);
  const byGrade=GRADES.map(g=>{
    const stus=DB.students.filter(s=>s.grade===g).map(s=>s.id);
    return {grade:g,count:in30.filter(r=>stus.includes(r.studentId)).length};
  });
  const maxG=Math.max(...byGrade.map(b=>b.count),1);
  const recent=DB.records.slice(0,6);
  const topStu=[...DB.students].map(s=>({s,...stuStats(s.id)})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,5);
  
  return `<div class="space-y-6">
    <header class="flex items-center justify-between flex-wrap gap-3">
      <div><h1 class="text-2xl lg:text-3xl font-black">لوحة التحكم</h1>
      <p class="text-sm text-slate-500 mt-1">آخر 30 يوماً</p></div>
      <button onclick="showPage('entry')" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-5 py-3 rounded-xl">+ تسجيل مخالفة</button>
    </header>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${stat('مخالفات مسجلة',in30.length,'📋','from-slate-700 to-slate-800')}
      ${stat('إجمالي النقاط',totalPoints,'⚠️','from-rose-500 to-rose-600')}
      ${stat('عدد الطلبة',DB.students.length,'👥','from-emerald-600 to-emerald-800')}
      ${stat('تنبيهات نشطة',computeAlerts().length,'🔔','from-amber-500 to-amber-600')}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h3 class="font-black mb-4">المخالفات حسب الصفوف</h3>
        <div class="space-y-3">${byGrade.map(b=>`<div class="flex items-center gap-3">
          <div class="w-16 text-sm font-bold">الصف ${b.grade}</div>
          <div class="flex-1 h-6 bg-slate-100 rounded-lg overflow-hidden">
            <div class="h-full bg-gradient-to-l from-rose-400 to-red-600 rounded-lg" style="width:${(b.count/maxG)*100}%"></div>
          </div>
          <div class="w-14 text-left text-xs font-bold">${b.count}</div>
        </div>`).join('')}</div>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h3 class="font-black mb-4">أكثر الطلبة تكراراً</h3>
        <div class="space-y-2">${topStu.length?topStu.map(x=>`<div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50">
          <div class="w-9 h-9 rounded-xl bg-red-50 text-red-600 flex items-center justify-center font-black">${x.count}</div>
          <div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">${x.s.name}</div>
          <div class="text-xs text-slate-500">الصف ${x.s.grade} / شعبة ${x.s.section}</div></div>
          <div class="text-xs font-bold text-red-600">-${x.points}</div>
        </div>`).join(''):'<div class="text-center text-slate-400 py-8 text-sm">لا توجد بيانات</div>'}</div>
      </div>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-black">أحدث المخالفات المسجلة</h3>
        <button onclick="showPage('records')" class="text-xs font-bold text-emerald-700">عرض الكل ←</button>
      </div>
      <div class="space-y-2">${recent.length?recent.map(r=>{const s=getStu(r.studentId),b=getBeh(r.behaviorId),a=getAct(r.actionId);
        return `<div class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50">
          <div class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center font-bold">!</div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-sm truncate">${s?s.name:'—'}</div>
            <div class="text-xs text-slate-500 truncate">${b?b.name:'—'} · ${a?a.name:'—'}</div>
          </div>
          <div class="text-left">
            <div class="text-xs font-bold text-red-600">-${r.points||0}</div>
            <div class="text-[10px] text-slate-400">${timeAgo(r.createdAt)}</div>
          </div>
        </div>`;}).join(''):'<div class="text-center text-slate-400 py-8 text-sm">لا توجد سجلات</div>'}</div>
    </div>
  </div>`;
}

function stat(t,v,i,grad){
  return `<div class="bg-gradient-to-br ${grad} text-white rounded-2xl p-4 relative overflow-hidden">
    <div class="absolute -left-2 -bottom-2 opacity-15 text-7xl">${i}</div>
    <div class="relative"><div class="text-xs opacity-90 font-semibold">${t}</div>
    <div class="text-3xl font-black mt-1">${v}</div></div></div>`;
}

// ========== تسجيل مخالفة ==========
let entryState={sid:'',bid:'',aid:'',note:'',uid:'',attended:null,actionNote:''};

function renderEntry(){
  const activeBeh=DB.behaviors.filter(b=>b.active);
  const selectedBeh=DB.behaviors.find(b=>b.id===entryState.bid);
  return `<div class="max-w-3xl space-y-4">
    <header><h1 class="text-2xl lg:text-3xl font-black">تسجيل مخالفة</h1>
    <p class="text-sm text-slate-500 mt-1">إدخال سريع مع اختيار الإجراء</p></header>
    
    <div class="bg-white rounded-2xl p-5 shadow-sm space-y-4">
      <div>
        <label class="block text-sm font-bold mb-2">بحث الطالب (بالاسم / الصف / الشعبة)</label>
        <div class="grid grid-cols-3 gap-2 mb-2">
          <input id="searchName" placeholder="اسم الطالب..." class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm col-span-3 md:col-span-1" oninput="filterStudents()">
          <select id="searchGrade" onchange="filterStudents()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">
            <option value="">كل الصفوف</option>${GRADES.map(g=>`<option value="${g}">الصف ${g}</option>`).join('')}
          </select>
          <select id="searchSection" onchange="filterStudents()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">
            <option value="">كل الشعب</option>${SECTIONS.map(s=>`<option value="${s}">شعبة ${s}</option>`).join('')}
          </select>
        </div>
        <select id="fStudent" size="5" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white" onchange="entryState.sid=this.value">
        </select>
      </div>
      
      <div>
        <label class="block text-sm font-bold mb-2">المخالفة *</label>
        <select id="fBehavior" onchange="entryState.bid=this.value;updateEntryView()" class="w-full rounded-xl border-2 border-slate-200 px-3 py-3 text-sm font-bold bg-white">
          <option value="">— اختر المخالفة —</option>
          ${activeBeh.map(b=>`<option value="${b.id}" ${entryState.bid===b.id?'selected':''}>${b.name} (${b.points} نقطة)</option>`).join('')}
        </select>
      </div>
      
      <div>
        <label class="block text-sm font-bold mb-2">الإجراء المتخذ *</label>
        <select id="fAction" onchange="entryState.aid=this.value;updateEntryView()" class="w-full rounded-xl border-2 border-slate-200 px-3 py-3 text-sm font-bold bg-white">
          <option value="">— اختر الإجراء —</option>
          ${DB.actions.map(a=>`<option value="${a.id}" ${entryState.aid===a.id?'selected':''}>${a.name}</option>`).join('')}
        </select>
      </div>
      
      <div id="actionExtra" class="hidden bg-amber-50 rounded-xl p-4 border-r-4 border-amber-500">
        <div class="text-sm font-bold text-amber-800 mb-3">بيانات إضافية للإجراء</div>

function filterStudents(){
  const q=(document.getElementById('searchName').value||'').trim();
  const g=document.getElementById('searchGrade').value;
  const s=document.getElementById('searchSection').value;
  const filtered=DB.students.filter(st=>{
    if(q&&!st.name.includes(q))return false;
    if(g&&st.grade!==+g)return false;
    if(s&&st.section!==+s)return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  document.getElementById('fStudent').innerHTML=filtered.slice(0,200).map(st=>
    `<option value="${st.id}" ${entryState.sid===st.id?'selected':''}>${st.name} — صف ${st.grade} / شعبة ${st.section}</option>`

}

function updateEntryView(){

function saveRecord(){
  if(!entryState.sid){toast('اختر الطالب','err');return}
  if(!entryState.bid){toast('اختر المخالفة','err');return}
  if(!entryState.aid){toast('اختر الإجراء','err');return}
  if(!entryState.uid){toast('اختر المستخدم','err');return}
  const b=getBeh(entryState.bid);
  const rec={
    id:uid('R'),
    studentId:entryState.sid,
    behaviorId:entryState.bid,
    actionId:entryState.aid,
    userId:entryState.uid,
    points:b?b.points:0,
    note:entryState.note,
    attended:entryState.attended,
    actionNote:entryState.actionNote,
    createdAt:Date.now()
  };
  DB.records.unshift(rec);
  save();
  toast('✓ تم حفظ المخالفة');
  entryState={sid:'',bid:'',aid:'',note:'',uid:'',attended:null,actionNote:''};
  render();
}

function filterRecords(){
  return DB.records.filter(r=>{
    const s=getStu(r.studentId);if(!s)return false;
    if(recFilters.q){const x=recFilters.q.trim();
      if(!(s.name.includes(x)||(getBeh(r.behaviorId)?.name||'').includes(x)))return false;}
    if(recFilters.grade&&s.grade!==+recFilters.grade)return false;
    if(recFilters.section&&s.section!==+recFilters.section)return false;
    if(recFilters.from){const t=new Date(recFilters.from).getTime();if(r.createdAt<t)return false}
    if(recFilters.to){const t=new Date(recFilters.to).getTime()+864e5;if(r.createdAt>t)return false}
    return true;
  });
}

function deleteRecord(id){if(confirm('حذف السجل؟')){DB.records=DB.records.filter(r=>r.id!==id);save();render();}}

function exportExcel(){
  const rows=[['التاريخ','الطالب','الصف','الشعبة','المخالفة','النقاط','الإجراء','حضور ولي الأمر','ملاحظة الإجراء','المستخدم','ملاحظات']];
  filterRecords().forEach(r=>{const s=getStu(r.studentId);
    rows.push([fmtDate(r.createdAt),s?s.name:'',s?s.grade:'',s?s.section:'',
      getBeh(r.behaviorId)?.name||'',r.points||0,getAct(r.actionId)?.name||'',
      r.attended==='yes'?'حضر':r.attended==='no'?'لم يحضر':'',r.actionNote||'',getUser(r.userId)?.name||'',r.note||'']);});
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'المخالفات');
  XLSX.writeFile(wb,'سجل_المخالفات_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function doStuImport(){
  const paste=document.getElementById('pasteArea').value.trim();
  const file=document.getElementById('xlsFile').files[0];
  const replace=document.getElementById('replaceAll').checked;
  const imported=[];
  
  function parseLine(line){
    const parts=line.split(/[,\t،]/).map(x=>x.trim()).filter(x=>x!=='');
    if(parts.length<3)return null;
    const [name,grade,section,phone]=parts;
    const g=parseInt(grade),s=parseInt(section);
    if(!name||isNaN(g)||isNaN(s))return null;
    if(!GRADES.includes(g))return null;
    return {name,grade:g,section:s,phone:phone||''};
  }
  
  if(paste){
    paste.split('\n').forEach(line=>{const p=parseLine(line);if(p)imported.push(p)});
  }
  
  const processFile=(rows)=>{
    rows.forEach(row=>{
      const [name,grade,section,phone]=row.map(x=>String(x==null?'':x).trim());
      const g=parseInt(grade),s=parseInt(section);
      if(name&&!isNaN(g)&&!isNaN(s)&&GRADES.includes(g)){imported.push({name,grade:g,section:s,phone:phone||''})}
    });
    finalize();
  };
  
  const finalize=()=>{
    if(!imported.length){toast('لم يتم التعرف على أي طالب صالح','err');return}
    if(replace)DB.students=[];
    const existing=new Set(DB.students.map(s=>s.name+'|'+s.grade+'|'+s.section));
    let added=0,skipped=0;
    imported.forEach((p,i)=>{
      const key=p.name+'|'+p.grade+'|'+p.section;
      if(existing.has(key)){skipped++;return}
      existing.add(key);
      DB.students.push({id:uid('S'),...p});
      added++;
    });
    save();
    document.getElementById('modalRoot').innerHTML='';
    toast(`✓ تم إضافة ${added} طالب${skipped?' (تخطي '+skipped+' مكرر)':''}`);
    render();
  };
  
  if(file){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        processFile(rows);
      }catch(err){toast('خطأ في الملف: '+err.message,'err')}
    };
    reader.readAsArrayBuffer(file);
  } else {
    finalize();
  }
}

function populateStuList(){

function renderAlerts(){
  const alerts=computeAlerts();
  return `<div class="space-y-4">
    <header><h1 class="text-2xl lg:text-3xl font-black">🔔 التنبيهات</h1>
    <p class="text-sm text-slate-500 mt-1">${alerts.length} تنبيه نشط</p></header>
    ${alerts.length===0?`<div class="bg-white rounded-2xl p-12 text-center shadow-sm">
      <div class="text-5xl mb-3">✅</div>
      <div class="font-black text-emerald-700 text-lg">لا توجد تنبيهات</div>
    </div>`:
    alerts.map(a=>`<div class="bg-white rounded-2xl p-5 shadow-sm border-r-4 ${a.severity==='high'?'border-red-600':'border-amber-500'}">
      <div class="flex items-start gap-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center text-2xl ${a.severity==='high'?'bg-red-50':'bg-amber-50'}">${a.severity==='high'?'🚨':'⚠️'}</div>
        <div class="flex-1"><div class="font-black">${a.title}</div>
        <p class="text-sm text-slate-600 mt-1">${a.msg}</p></div>
        <button onclick="resolveAlert('${a.id}')" class="bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg">✓ معالجة</button>
      </div>
    </div>`).join('')}
  </div>`;
}
function resolveAlert(id){DB.resolvedAlerts.push(id);save();render();}

// ========== الإعدادات ==========
function renderSettings(){
  return `<div class="space-y-4 max-w-3xl">
    <header><h1 class="text-2xl lg:text-3xl font-black">⚙️ الإعدادات</h1>
    <p class="text-sm text-slate-500 mt-1">تخصيص المنصة</p></header>
    
    <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
      <h3 class="font-black">🏫 هوية المدرسة</h3>
      <div><label class="block text-sm font-bold mb-1">اسم المدرسة</label>
        <input id="sSchool" value="${esc(DB.config.schoolName)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-bold mb-1">السطر الوزاري</label>
        <input id="sMinistry" value="${esc(DB.config.ministry)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div>
        <label class="block text-sm font-bold mb-1">شعار المدرسة</label>
        <input type="file" id="sLogoFile" accept="image/*" class="text-sm">
        ${DB.config.logo?`<div class="mt-2 flex items-center gap-3">
          <img src="${DB.config.logo}" style="width:60px;height:60px;object-fit:contain" class="rounded border">
          <button onclick="removeLogo()" class="text-xs text-red-600 font-bold">حذف الشعار</button>
        </div>`:'<p class="text-xs text-slate-500 mt-1">لم يتم رفع شعار</p>'}
      </div>
    </div>
    
    <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
      <h3 class="font-black">📄 نصوص الطباعة</h3>
      <div><label class="block text-sm font-bold mb-1">عنوان تقرير المخالفة</label>
        <input id="sReportTitle" value="${esc(DB.config.reportTitle)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-bold mb-1">تذييل التقرير (رسالة لولي الأمر)</label>
        <textarea id="sReportFooter" rows="2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${esc(DB.config.reportFooter)}</textarea></div>
      <div><label class="block text-sm font-bold mb-1">عنوان نموذج التحويل الصحي</label>
        <input id="sHealthTitle" value="${esc(DB.config.healthTitle)}" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-bold mb-1">نص التحويل الصحي</label>
        <textarea id="sHealthBody" rows="2" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${esc(DB.config.healthBody)}</textarea></div>
      <div><label class="block text-sm font-bold mb-1">التوقيعات (كل سطر واحد)</label>
        <textarea id="sSigns" rows="3" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">${DB.config.signatures.join('\n')}</textarea></div>
    </div>
    
    <button onclick="saveSettings()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black py-3.5 rounded-xl">💾 حفظ الإعدادات</button>
    
    <div class="bg-white rounded-2xl p-6 shadow-sm space-y-3 mt-6">
      <h3 class="font-black text-red-600">⚠️ إجراءات متقدمة</h3>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportBackup()" class="bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-sm">📥 تصدير نسخة احتياطية</button>
        <label class="bg-white border-2 border-slate-200 font-bold px-4 py-2 rounded-xl text-sm cursor-pointer">📤 استيراد نسخة<input type="file" accept=".json" onchange="importBackup(this)" class="hidden"></label>
        <button onclick="resetAll()" class="bg-red-50 text-red-600 font-bold px-4 py-2 rounded-xl text-sm">🗑️ إعادة تعيين كل شيء</button>
      </div>
    </div>
  </div>`;
}
function saveSettings(){
  DB.config.schoolName=document.getElementById('sSchool').value;
  DB.config.ministry=document.getElementById('sMinistry').value;
  DB.config.reportTitle=document.getElementById('sReportTitle').value;
  DB.config.reportFooter=document.getElementById('sReportFooter').value;
  DB.config.healthTitle=document.getElementById('sHealthTitle').value;
  DB.config.healthBody=document.getElementById('sHealthBody').value;
  DB.config.signatures=document.getElementById('sSigns').value.split('\n').map(x=>x.trim()).filter(x=>x);
  const f=document.getElementById('sLogoFile').files[0];
  if(f){
    const r=new FileReader();
    r.onload=e=>{DB.config.logo=e.target.result;save();renderNav();toast('✓ تم الحفظ');render();};
    r.readAsDataURL(f);
  } else {
    save();renderNav();toast('✓ تم الحفظ');render();
  }
}
function removeLogo(){DB.config.logo='';save();renderNav();render();}
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{DB=JSON.parse(e.target.result);save();renderNav();toast('✓ تم الاستيراد');render();}catch(err){toast('ملف غير صالح','err')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('سيتم حذف جميع البيانات نهائياً. متأكد؟'))return;
  if(!confirm('تأكيد أخير: هل أنت متأكد تماماً؟'))return;
  localStorage.removeItem(KEY);DB=seed();save();renderNav();render();
}

// ========== الرئيسية ==========
function render(){
  const el=document.getElementById('content');
  if(currentPage==='dash')el.innerHTML=renderDash();
  else if(currentPage==='entry')el.innerHTML=renderEntry();
  else if(currentPage==='records')el.innerHTML=renderRecords();
  else if(currentPage==='students')el.innerHTML=renderStudents();
  else if(currentPage==='users')el.innerHTML=renderUsers();
  else if(currentPage==='behaviors')el.innerHTML=renderBehaviors();
  else if(currentPage==='actions')el.innerHTML=renderActions();
  else if(currentPage==='reports')el.innerHTML=renderReports();
  else if(currentPage==='alerts')el.innerHTML=renderAlerts();
  else if(currentPage==='settings')el.innerHTML=renderSettings();
  
  // تفعيل صفحة التسجيل
  if(currentPage==='entry'){
    filterStudents();
    updateEntryView();
  }
  window.scrollTo(0,0);
}

// ========== بدء التشغيل ==========
renderNav();
showPage('dash');
</script>
