<style>

body{font-family:var(--font-family),system-ui,sans-serif;background:var(--c-bg);margin:0;font-size:var(--font-size);position:relative;min-height:100vh}

/* خلفية تعليمية خفيفة */

  background-size:280px;}

body.size-small{font-size:13px}
body.size-medium{font-size:15px}
body.size-large{font-size:17px}
body.size-xlarge{font-size:19px}

/* ألوان مخصصة */
.bg-primary{background:var(--c-primary)!important}
.bg-primary-light{background:var(--c-primary-light)!important}
.bg-primary-soft{background:var(--c-primary-soft)!important}
.text-primary{color:var(--c-primary)!important}
.text-primary-dark{color:var(--c-primary-dark)!important}
.border-primary{border-color:var(--c-primary)!important}
.hover\:bg-primary:hover{background:var(--c-primary)!important}
.hover\:bg-primary-dark:hover{background:var(--c-primary-dark)!important}
.bg-gradient-primary{background-image:linear-gradient(135deg,var(--c-primary),var(--c-primary-dark))!important}

/* أيقونات محسّنة */
.icon-box{display:flex;align-items:center;justify-content:center;border-radius:16px;font-size:1.75rem;box-shadow:0 4px 12px -2px rgba(0,0,0,.15);position:relative;overflow:hidden}
.icon-box::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,255,255,.3) 0%,transparent 60%);pointer-events:none}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;overflow-y:auto;backdrop-filter:blur(4px)}
.tooltip-box{position:absolute;background:#1e293b;color:white;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;max-width:240px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.25);line-height:1.6}
@media print{.no-print{display:none!important}}
.help-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--c-primary-soft);color:var(--c-primary);border-radius:50%;font-size:11px;font-weight:900;cursor:pointer;border:1.5px solid var(--c-primary);margin-right:6px;vertical-align:middle}

.icon-card{transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.icon-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:left .5s}
.icon-card:hover::before{left:100%}
.icon-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 40px -12px rgba(0,0,0,.25)}

.search-dropdown{position:absolute;top:100%;right:0;left:0;background:white;border:2px solid var(--c-primary);border-top:none;border-radius:0 0 12px 12px;max-height:320px;overflow-y:auto;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.search-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.search-item:hover{background:var(--c-primary-soft)}
.search-item:last-child{border-bottom:none}
.search-item.selected{background:var(--c-primary-soft);font-weight:700}

.hero-bg{background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-primary-dark) 100%);position:relative;overflow:hidden}

const KEY='almasaa_v6';
function seed(){
  const students=DEFAULT_STUDENTS.map(([name,grade,section],i)=>({id:'S'+String(i+1).padStart(3,'0'),name,grade,section,phone:''}));
  return {config:{...DEFAULT_CONFIG},users:JSON.parse(JSON.stringify(DEFAULT_USERS)),students,
    behaviors:[...DEFAULT_BEHAVIORS],actions:[...DEFAULT_ACTIONS],healthRecords:[],
    healthReferrals:[],records:[],followups:[],resolvedAlerts:[]};
}
let DB;
try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):seed();}catch(e){DB=seed();}
if(!DB.healthReferrals)DB.healthReferrals=[];
if(!DB.followups)DB.followups=[];
// تأكد من وجود admin
if(!DB.users.some(u=>u.isAdmin)){
  DB.users.unshift({id:'U0',name:'مدير النظام',title:'مدير',username:'almasaa',password:'123456',isAdmin:true});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function uid(p){return p+Date.now()+Math.floor(Math.random()*1000)}

// ========== نظام الدخول ==========
let CURRENT_USER=null;
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  if(!user){
    const err=document.getElementById('loginError');
    err.textContent='❌ اسم المستخدم أو كلمة المرور غير صحيحة';
    err.classList.remove('hidden');
    return;
  }
  CURRENT_USER=user;
  sessionStorage.setItem('almasaa_current',user.id);
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appContainer').classList.remove('hidden');
  document.getElementById('currentUserSide').textContent=user.name;
  startApp();
}
function doLogout(){
  if(!confirm('هل تريد تسجيل الخروج؟'))return;
  CURRENT_USER=null;
  sessionStorage.removeItem('almasaa_current');
  document.getElementById('appContainer').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginPass').value='';
}
function isAdmin(){return CURRENT_USER&&CURRENT_USER.isAdmin;}

// ========== الثيم والحجم والخط ==========
function applyTheme(){
  const t=THEMES[DB.config.theme]||THEMES.emerald;
  const r=document.documentElement.style;
  r.setProperty('--c-primary',t.primary);
  r.setProperty('--c-primary-light',t.light);
  r.setProperty('--c-primary-dark',t.dark);
  r.setProperty('--c-primary-soft',t.soft);
  r.setProperty('--c-bg',t.bg);
}
function applySize(){
  document.body.className=document.body.className.replace(/size-\w+/g,'').trim();
  document.body.classList.add('size-'+(DB.config.uiSize||'medium'));

function tooltip(txt){
  const id='tt'+Math.random().toString(36).slice(2);
  return `<span class="help-icon" onclick="showTooltip(event,'${id}')">?</span><span id="${id}" class="tooltip-box" style="display:none">${esc(txt)}</span>`;
}
function showTooltip(ev,id){
  ev.stopPropagation();
  document.querySelectorAll('.tooltip-box').forEach(t=>{if(t.id!==id)t.style.display='none'});
  const el=document.getElementById(id);if(!el)return;
  if(el.style.display==='block'){el.style.display='none';return}
  const r=ev.target.getBoundingClientRect();
  el.style.display='block';el.style.position='fixed';
  el.style.top=(r.bottom+6)+'px';el.style.right=(window.innerWidth-r.right)+'px';
  setTimeout(()=>{document.addEventListener('click',function h(){el.style.display='none';document.removeEventListener('click',h)},10);},10);
}
function toast(msg,type='ok'){
  let t=document.getElementById('toast');
  if(!t){const d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100';document.body.appendChild(d);t=d}
  t.innerHTML=`<div class="px-5 py-3 rounded-xl font-bold text-sm shadow-lg ${type==='ok'?'bg-primary text-white':'bg-red-600 text-white'}">${msg}</div>`;
  setTimeout(()=>{t.innerHTML=''},2500);
}

function openWhatsApp(phone,message){

  if(clean.startsWith('00'))clean=clean.slice(2);

// ========== الحسابات ==========
function computeAlerts(){
  const now=Date.now();
  const in30=DB.records.filter(r=>now-r.createdAt<=30*864e5);
  const cnt={};in30.forEach(r=>{cnt[r.studentId]=(cnt[r.studentId]||0)+1});
  const list=[];
  Object.entries(cnt).forEach(([sid,c])=>{
    const s=getStu(sid);if(!s)return;
    if(c>=3)list.push({id:sid+'_30',sid,severity:c>=5?'high':'medium',title:'تكرار المخالفات',msg:`${s.name} (صف ${s.grade}/شعبة ${s.section}) لديه ${c} مخالفة خلال 30 يوماً`,type:'repeat'});
  });
  return list.filter(a=>!DB.resolvedAlerts.includes(a.id));
}
function computeFollowups(){
  const now=Date.now();
  return DB.followups.filter(f=>!f.resolved).map(f=>{
    const r=DB.records.find(x=>x.id===f.recordId);
    const s=getStu(f.studentId);
    const days=Math.floor((now-f.createdAt)/864e5);
    return {...f,record:r,student:s,daysSince:days};
  }).filter(f=>f.student&&f.daysSince>=1);
}
function createFollowup(recordId,studentId){
  DB.followups.push({id:uid('F'),recordId,studentId,attended:null,note:'',resolved:false,createdAt:Date.now()});
}
function resolveFollowup(id,status,note){
  const f=DB.followups.find(x=>x.id===id);if(!f)return;
  f.attended=status;f.note=note||'';f.resolved=true;f.resolvedAt=Date.now();
}
function clearStudentFollowups(sid){DB.followups=DB.followups.filter(f=>f.studentId!==sid||f.resolved);}

function stuStats(sid){
  const recs=DB.records.filter(r=>r.studentId===sid);
  return {count:recs.length,points:recs.reduce((s,r)=>s+(r.points||0),0)};
}

function filterRecords(){
  return DB.records.filter(r=>{
    const s=getStu(r.studentId);if(!s)return false;
    if(recFilters.q){const x=recFilters.q.trim();if(!(s.name.includes(x)||(r.behaviorName||'').includes(x)))return false;}
    if(recFilters.grade&&s.grade!==+recFilters.grade)return false;
    if(recFilters.section&&s.section!==+recFilters.section)return false;
    if(recFilters.from){const t=new Date(recFilters.from).getTime();if(r.createdAt<t)return false}
    if(recFilters.to){const t=new Date(recFilters.to).getTime()+864e5;if(r.createdAt>t)return false}
    return true;
  });
}
function deleteRecord(id){
  if(!confirm('حذف؟'))return;
  DB.records=DB.records.filter(r=>r.id!==id);
  DB.followups=DB.followups.filter(f=>f.recordId!==id);
  save();render();
}

  const rows=[['التاريخ','الطالب','الصف','الشعبة','المخالفة','النقاط','الإجراء','المتابعة','ملاحظة','المستخدم']];

    const fu=DB.followups.find(f=>f.recordId===r.id);

}

// ========== التحليل المتقدم مع الرسوم البيانية ==========
let analyticsFilters={from:'',to:'',grade:'',section:'',period:'month'};
let charts={};
function setPeriod(p){
  const now=new Date();const end=now.getTime();let start=0;
  if(p==='week')start=end-7*864e5;
  else if(p==='month')start=end-30*864e5;
  else if(p==='term')start=end-90*864e5;
  else if(p==='year')start=end-365*864e5;
  analyticsFilters.period=p;
  analyticsFilters.from=start?new Date(start).toISOString().slice(0,10):'';
  analyticsFilters.to=new Date(end).toISOString().slice(0,10);
  render();
}
function computeAnalytics(f){
  f=f||{};
  let recs=DB.records.slice();
  if(f.from)recs=recs.filter(r=>r.createdAt>=f.from);
  if(f.to)recs=recs.filter(r=>r.createdAt<=f.to+864e5);
  if(f.grade)recs=recs.filter(r=>{const s=getStu(r.studentId);return s&&s.grade===+f.grade});
  if(f.section)recs=recs.filter(r=>{const s=getStu(r.studentId);return s&&s.section===+f.section});
  const behCount={};recs.forEach(r=>{const k=r.behaviorName||'—';behCount[k]=(behCount[k]||0)+1});
  const topBehaviors=Object.entries(behCount).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);
  const gradeCount={};recs.forEach(r=>{const s=getStu(r.studentId);if(!s)return;gradeCount[s.grade]=(gradeCount[s.grade]||0)+1});
  const topGrades=GRADES.map(g=>({grade:g,count:gradeCount[g]||0}));
  const secByGrade={};recs.forEach(r=>{const s=getStu(r.studentId);if(!s)return;
    const k=s.grade+'|'+s.section;if(!secByGrade[k])secByGrade[k]={grade:s.grade,section:s.section,count:0};secByGrade[k].count++;});
  const topSections=Object.values(secByGrade).sort((a,b)=>b.count-a.count);
  const actCount={};recs.forEach(r=>{const k=r.actionName||'—';actCount[k]=(actCount[k]||0)+1});
  const topActions=Object.entries(actCount).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);
  const stuCount={};recs.forEach(r=>{stuCount[r.studentId]=(stuCount[r.studentId]||0)+1});
  const topStudents=Object.entries(stuCount).map(([sid,c])=>({student:getStu(sid),count:c})).filter(x=>x.student).sort((a,b)=>b.count-a.count).slice(0,10);
  const insights=[];
  if(topBehaviors[0]&&topBehaviors[0].count>=3)insights.push({icon:'📌',text:`النمط الأكثر تسجيلاً: "${topBehaviors[0].name}" (${topBehaviors[0].count} حالة).`});
  if(topSections[0]&&topSections[0].count>=3){const ts=topSections[0];insights.push({icon:'🎯',text:`الشعبة ${ts.section} من الصف ${ts.grade} الأكثر تسجيلاً للمخالفات (${ts.count} حالة).`});}

      </div>

        <button onclick="doStuImport()" class="flex-1 bg-primary text-white font-bold py-2.5 rounded-xl">رفع</button>

function doStuImport(){
  const paste=document.getElementById('pasteArea').value.trim();
  const file=document.getElementById('xlsFile').files[0];
  const replace=document.getElementById('replaceAll').checked;
  const imported=[];
  const parseLine=line=>{
    const parts=line.split(/[,\t،]/).map(x=>x.trim()).filter(x=>x!=='');
    if(parts.length<3)return null;
    const [name,grade,section,phone]=parts;
    const g=parseInt(grade),s=parseInt(section);
    if(!name||isNaN(g)||isNaN(s)||!GRADES.includes(g))return null;
    return {name,grade:g,section:s,phone:phone||''};
  };
  if(paste)paste.split('\n').forEach(line=>{const p=parseLine(line);if(p)imported.push(p)});
  const processFile=rows=>{rows.forEach(row=>{
    const [name,grade,section,phone]=row.map(x=>String(x==null?'':x).trim());
    const g=parseInt(grade),s=parseInt(section);
    if(name&&!isNaN(g)&&!isNaN(s)&&GRADES.includes(g))imported.push({name,grade:g,section:s,phone:phone||''});
  });finalize();};
  const finalize=()=>{
    if(!imported.length){toast('لا يوجد طلبة','err');return}
    if(replace)DB.students=[];
    const existing=new Set(DB.students.map(s=>s.name+'|'+s.grade+'|'+s.section));
    let added=0,skipped=0;
    imported.forEach(p=>{
      const k=p.name+'|'+p.grade+'|'+p.section;
      if(existing.has(k)){skipped++;return}
      existing.add(k);DB.students.push({id:uid('S'),...p});added++;
    });
    save();document.getElementById('modalRoot').innerHTML='';
    toast(`✓ ${added} طالب${skipped?' (تخطي '+skipped+')':''}`);render();
  };
  if(file){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        processFile(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
      }catch(err){toast('خطأ','err')}
    };
    reader.readAsArrayBuffer(file);
  } else finalize();
}

let hrFilters={from:'',to:'',grade:'',section:''};
function renderHealthReport(){
  const list=DB.healthReferrals.filter(h=>{
    if(hrFilters.from&&h.createdAt<new Date(hrFilters.from).getTime())return false;
    if(hrFilters.to&&h.createdAt>new Date(hrFilters.to).getTime()+864e5)return false;
    const s=getStu(h.studentId);
    if(!s)return false;
    if(hrFilters.grade&&s.grade!==+hrFilters.grade)return false;
    if(hrFilters.section&&s.section!==+hrFilters.section)return false;
    return true;
  }).map(h=>({...h,student:getStu(h.studentId)})).filter(h=>h.student);
  
  // إحصائيات
  const byGrade={};GRADES.forEach(g=>byGrade[g]=0);
  list.forEach(h=>{byGrade[h.student.grade]++});
  const maxGrade=Math.max(...Object.values(byGrade),1);
  
  return `<div class="space-y-4">
    <header class="flex items-center justify-between flex-wrap gap-3">
      <div><h1 class="text-2xl lg:text-3xl font-black">📊 تقرير الوحدة الصحية</h1>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <input type="date" value="${hrFilters.from}" onchange="hrFilters.from=this.value;render()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">
        <input type="date" value="${hrFilters.to}" onchange="hrFilters.to=this.value;render()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm">
        <select onchange="hrFilters.grade=this.value;render()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">
          <option value="">كل الصفوف</option>${GRADES.map(g=>`<option value="${g}" ${hrFilters.grade==g?'selected':''}>الصف ${g}</option>`).join('')}
        </select>
        <select onchange="hrFilters.section=this.value;render()" class="rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-bold bg-white">
          <option value="">كل الشعب</option>${SECTIONS.map(s=>`<option value="${s}" ${hrFilters.section==s?'selected':''}>شعبة ${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
      ${statCard('إجمالي التحويلات',list.length,'🏥','linear-gradient(135deg,#ec4899,#9d174d)')}
      ${GRADES.slice(0,4).map(g=>statCard('الصف '+g,byGrade[g],'📚','linear-gradient(135deg,#6366f1,#3730a3)')).join('')}
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm">
      <h3 class="font-black mb-4">📊 التحويلات حسب الصف</h3>
      <div class="space-y-3">
        ${GRADES.map(g=>`<div class="flex items-center gap-3">
          <div class="w-16 text-sm font-bold">الصف ${g}</div>
          <div class="flex-1 h-5 bg-slate-100 rounded-lg overflow-hidden"><div class="bg-primary h-full" style="width:${(byGrade[g]/maxGrade)*100}%"></div></div>
          <div class="w-10 text-left text-xs font-bold">${byGrade[g]}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 border-b"><tr class="text-right">
          <th class="px-3 py-3 font-black text-xs">التاريخ</th>

            <td class="px-3 py-3 font-bold text-xs">${esc(h.student.name)}</td>

            <td class="px-3 py-3 text-xs">${u?esc(u.name):'—'}</td>

function saveUser(id){
  const name=document.getElementById('uName').value.trim();
  const title=document.getElementById('uTitle').value.trim();
  const username=document.getElementById('uUser').value.trim();
  const password=document.getElementById('uPass').value;
  const adm=document.getElementById('uAdmin').checked;
  if(!name||!title){toast('أكمل الحقول','err');return}
  // تحقق من تكرار اسم المستخدم
  if(username&&DB.users.some(u=>u.username===username&&u.id!==id)){toast('اسم المستخدم محجوز','err');return}
  if(id){
    const u=getUser(id);u.name=name;u.title=title;u.username=username;u.password=password;u.isAdmin=adm;
    if(u.id===CURRENT_USER.id)CURRENT_USER=u;
  } else {
    DB.users.push({id:uid('U'),name,title,username,password,isAdmin:adm});
  }
  save();document.getElementById('modalRoot').innerHTML='';toast('✓');render();
}
function delUser(id){
  const u=getUser(id);if(!u)return;
  if(u.isAdmin&&DB.users.filter(x=>x.isAdmin).length===1){toast('يجب وجود مدير واحد على الأقل','err');return}
  if(!confirm('حذف المستخدم؟'))return;
  DB.users=DB.users.filter(x=>x.id!==id);save();document.getElementById('modalRoot').innerHTML='';toast('✓');render();
}

function doPrintCards(){
  const g=+document.getElementById('cGrade').value;
  const sec=document.getElementById('cSection').value;
  const stus=DB.students.filter(s=>s.grade===g&&(!sec||s.section===+sec)).sort((a,b)=>a.section-b.section||a.name.localeCompare(b.name,'ar'));
  const rows=stus.map((s,i)=>`<tr>
    <td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${i+1}</td>
    <td style="border:1px solid #999;padding:5px;font-size:10px">${esc(s.name)}</td>
    <td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${s.section}</td>
    <td style="border:1px solid #999;padding:5px;text-align:center;font-size:10px">${s.phone?esc(s.phone):'—'}</td>
  </tr>`).join('');
  const html=`<div style="max-width:900px;margin:auto">
    ${reportHeader()}
    <div style="text-align:center;font-weight:900;font-size:14px;margin-bottom:12px">كشف طلبة الصف ${g} ${sec?'شعبة '+sec:''} (${stus.length})</div>
    <table style="width:100%;border-collapse:collapse;font-size:10px">
      <thead><tr style="background:var(--c-primary);color:white">
        <th style="border:1px solid #999;padding:6px;width:40px">#</th>
        <th style="border:1px solid #999;padding:6px">الاسم</th>
        <th style="border:1px solid #999;padding:6px;width:70px">الشعبة</th>
        <th style="border:1px solid #999;padding:6px;width:110px">هاتف ولي الأمر</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${reportFooter()}
  </div>`;
  document.getElementById('modalRoot').innerHTML='';
  printHTML(html);
}

function resolveFU(id,status){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)this.remove()">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md">
      <h3 class="font-black text-lg mb-4">${status==='yes'?'✓ تم حضور ولي الأمر':status==='no'?'✗ لم يحضر ولي الأمر':'📝 ملاحظة'}</h3>
      <div class="space-y-3">
        <div><label class="block text-xs font-bold mb-1">ملاحظات</label>
          <textarea id="fuNote" rows="3" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm" placeholder="اكتب ملاحظة حول المتابعة..."></textarea></div>
      </div>
      <div class="flex gap-2 mt-4">
        <button onclick="confirmFU('${id}','${status}')" class="flex-1 bg-primary text-white font-bold py-2.5 rounded-xl">حفظ وإغلاق</button>
        <button onclick="this.closest('.modal-bg').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button>
      </div>
    </div>
  </div>`;
}
function confirmFU(id,status){
  const note=document.getElementById('fuNote').value.trim();
  if(status==='note'&&!note){toast('اكتب ملاحظة','err');return}
  resolveFollowup(id,status==='yes'?'yes':status==='no'?'no':null,note);
  if(status==='note'){const f=DB.followups.find(x=>x.id===id);if(f){f.resolved=false;f.note=note;}}
  save();document.getElementById('modalRoot').innerHTML='';toast('✓ تم');render();
}

function saveSettings(){
  const get=id=>{const el=document.getElementById(id);return el?el.value:''};
  DB.config.platformName=get('sPlatform');
  DB.config.schoolName=get('sSchool');
  DB.config.ministry=get('sMinistry');
  DB.config.directorate=get('sDirectorate');
  DB.config.committeeText=get('sCommittee');
  DB.config.adminDeptText=get('sAdminDept');
  DB.config.principalTitle=get('sPrincipalTitle');
  DB.config.principalName=get('sPrincipalName');
  DB.config.healthVisitorTitle=get('sHealthVisitorTitle');
  DB.config.healthVisitorName=get('sHealthVisitorName');
  DB.config.reportTitle=get('sReportTitle');
  DB.config.reportFooter=get('sReportFooter');
  DB.config.signatures=get('sSigns').split('\n').map(x=>x.trim()).filter(x=>x);
  DB.config.healthTitle=get('sHealthTitle');
  DB.config.healthRecipient=get('sHealthRecipient');
  DB.config.healthGreeting=get('sHealthGreeting');
  DB.config.healthBody=get('sHealthBody');
  DB.config.healthClosing=get('sHealthClosing');
  DB.config.healthReturnNote=get('sHealthReturn');
  DB.config.healthBottomOptions=get('sHealthOptions').split(',').map(x=>x.trim()).filter(x=>x);
  const fr=document.getElementById('sLogoR').files[0];
  const fl=document.getElementById('sLogoL').files[0];
  let pending=0;
  const done=()=>{if(pending===0){save();renderNav();toast('✓ تم الحفظ');render();}};
  if(fr){pending++;const r=new FileReader();r.onload=e=>{DB.config.logoRight=e.target.result;pending--;done()};r.readAsDataURL(fr);}
  if(fl){pending++;const r=new FileReader();r.onload=e=>{DB.config.logoLeft=e.target.result;pending--;done()};r.readAsDataURL(fl);}
  if(pending===0){save();renderNav();toast('✓ تم الحفظ');render();}
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{DB=JSON.parse(e.target.result);save();applyTheme();applySize();applyFont();renderNav();toast('✓');render();}catch(err){toast('ملف غير صالح','err')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('حذف كل البيانات؟'))return;
  if(!confirm('تأكيد أخير؟'))return;
  localStorage.removeItem(KEY);DB=seed();save();applyTheme();applySize();renderNav();render();
}

// ========== Render ==========
function render(){
  const el=document.getElementById('content');
  destroyCharts();
  const maps={home:renderHome,entry:renderEntry,records:renderRecords,analytics:renderAnalytics,
    students:renderStudents,health:renderHealth,healthTransfer:renderHealthTransfer,
    healthReport:renderHealthReport,users:renderUsers,behaviors:renderBehaviors,actions:renderActions,
    reports:renderReports,alerts:renderAlerts,settings:renderSettings};
  el.innerHTML=(maps[currentPage]||renderHome)();
  if(currentPage==='entry'){updateEntryView();if(entryState.sid){const st=getStu(entryState.sid);if(st){document.getElementById('smartSearch').value=st.name;onStudentSelect();}}}
  if(currentPage==='analytics'){setTimeout(drawCharts,100);}
  window.scrollTo(0,0);
}

// ========== بدء ==========
function startApp(){
  renderNav();
  showPage('home');
}
// تحقق من جلسة سابقة
const savedSession=sessionStorage.getItem('almasaa_current');
if(savedSession){
  const u=DB.users.find(x=>x.id===savedSession);
  if(u){
    CURRENT_USER=u;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appContainer').classList.remove('hidden');
    document.getElementById('currentUserSide').textContent=u.name;
    startApp();
  }
}
</script>
</body>
