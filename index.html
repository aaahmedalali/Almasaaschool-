<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>منصة مدرسة المسعى (٥-٩)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background:#F8FAFC;margin:0}
.hidden{display:none!important}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>

<div class="min-h-screen flex flex-row-reverse">

<!-- Sidebar -->
<aside id="sidebar" class="fixed lg:static top-0 right-0 h-screen w-72 bg-white border-l border-slate-200 z-40 transform translate-x-full lg:translate-x-0 transition-transform flex flex-col">
  <div class="p-5 border-b flex items-center gap-3">
    <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-700 to-emerald-900 flex items-center justify-center">
      <span class="text-amber-400 text-2xl font-black">م</span>
    </div>
    <div>
      <div class="font-black text-emerald-700 text-sm">مدرسة المسعى</div>
      <div class="text-xs text-slate-500">التعليم الأساسي للبنين ٥-٩</div>
    </div>
  </div>
  <nav class="flex-1 p-3 space-y-1">
    <button onclick="showPage('dash')" data-page="dash" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-emerald-50"><span>📊</span>لوحة التحكم</button>
    <button onclick="showPage('entry')" data-page="entry" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-emerald-50"><span>✍️</span>تسجيل سلوك</button>
    <button onclick="showPage('log')" data-page="log" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-emerald-50"><span>📋</span>سجل السلوكيات</button>
    <button onclick="showPage('students')" data-page="students" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-emerald-50"><span>👥</span>الطلبة</button>
    <button onclick="showPage('ai')" data-page="ai" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-emerald-50"><span>🧠</span>الإرشاد الذكي</button>
    <button onclick="showPage('alerts')" data-page="alerts" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-emerald-50"><span>🔔</span>التنبيهات <span id="alertBadge" class="bg-red-600 text-white text-xs rounded-full px-2 hidden"></span></button>
    <button onclick="showPage('reports')" data-page="reports" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-emerald-50"><span>📄</span>التقارير</button>
  </nav>
</aside>

<!-- Main -->
<main class="flex-1 overflow-x-hidden">
  <button onclick="document.getElementById('sidebar').classList.toggle('translate-x-full')" class="lg:hidden fixed top-4 right-4 z-50 bg-emerald-700 text-white p-3 rounded-xl shadow-lg no-print">☰</button>
  <div id="content" class="p-4 lg:p-8 pt-20 lg:pt-8"></div>
</main>
</div>

<script>
// ===== البيانات =====
const GRADES=[5,6,7,8,9], SECTIONS=['أ','ب','ج'];
const POS=[
{id:'p1',l:'مشاركة فعالة في الحصة',p:2},{id:'p2',l:'مساعدة زميل',p:3},
{id:'p3',l:'الالتزام بالواجبات',p:2},{id:'p4',l:'سلوك متميز في الطابور',p:2},
{id:'p5',l:'تحسن ملحوظ في الأداء',p:4},{id:'p6',l:'مبادرة إيجابية',p:3},
{id:'p7',l:'المحافظة على النظافة',p:2},{id:'p8',l:'تمثيل المدرسة',p:5}];
const NEG=[
{id:'n1',l:'تأخر عن الحصة',p:1},{id:'n2',l:'عدم إحضار الأدوات',p:2},
{id:'n3',l:'إزعاج الصف',p:2},{id:'n4',l:'التلفظ بألفاظ غير لائقة',p:3},
{id:'n5',l:'التخلف عن الطابور',p:1},{id:'n6',l:'مشاجرة مع زميل',p:5},
{id:'n7',l:'إتلاف ممتلكات المدرسة',p:5},{id:'n8',l:'الغياب بدون عذر',p:3},
{id:'n9',l:'استخدام الهاتف في الصف',p:3},{id:'n10',l:'عدم تنفيذ التوجيهات',p:2}];
const NAMES=['أحمد بن سالم الرواحي','محمد بن خالد البلوشي','يوسف بن علي المعمري','عبدالله بن حمد الحارثي','سعيد بن راشد الكندي','خالد بن ناصر الفارسي','سلطان بن ماجد الشكيلي','حمزة بن ياسر العامري','طلال بن سعيد الهنائي','فهد بن عبدالرحمن الزدجالي','بدر بن سليمان الريامي','مازن بن حمدان الحجري','معاذ بن طارق السعدي','أيمن بن وليد المقبالي','راشد بن سيف الخروصي','هلال بن منصور الغافري','نبيل بن عامر الحوسني','قيس بن مروان الوهيبي','زياد بن فارس اليعقوبي','مروان بن أيمن السيابي','حاتم بن صالح العبري','عمار بن نبيل الجابري','أنس بن كمال الرئيسي','بلال بن هيثم المخيني','جعفر بن عادل الشعيلي','كرم بن رامي الصوافي','ليث بن جابر الحسني','مصعب بن أنور البوسعيدي','نزار بن صقر الهاشمي','وسام بن فاروق الأغبري','ياسر بن رمزي العجمي','يعقوب بن إسحاق النعماني','أسامة بن زهير الكلباني','إبراهيم بن نوح المسروري','إسماعيل بن ياسين الحبسي','بشار بن حكيم الشيباني','تمام بن سامي البطاشي','ثامر بن سليمان القريني','جاسم بن جابر العويسي','حسام بن لؤي المزروعي','رشيد بن عامر البلوشي','سامر بن منير الحديدي','شادي بن بشير اللواتي','صفوان بن رشيد الرحبي','طلحة بن زياد الفليتي','عبيد بن مبارك الوائلي','غيث بن هلال المحروقي','فيصل بن جمعة الروشدي'];
const TEACHERS=['أ. سعيد العامري','أ. خالد البلوشي','أ. محمد المعمري','أ. يوسف الحارثي','أ. أحمد الرواحي','أ. حمود الكندي','أ. راشد الفارسي','أ. سالم الشكيلي'];

// ===== التخزين =====
const KEY='almasaa_v3';
function seed(){
  const students=NAMES.map((n,i)=>({id:'S'+String(i+1).padStart(3,'0'),name:n,grade:GRADES[i%5],section:SECTIONS[i%3],guardian:'ولي أمر '+n.split(' ')[0],phone:'9'+(1000000+Math.floor(Math.random()*8999999))}));
  const behaviors=[],now=Date.now();
  for(let i=0;i<200;i++){
    const s=students[Math.floor(Math.random()*students.length)];
    const isP=Math.random()<0.6;
    const c=isP?POS[Math.floor(Math.random()*POS.length)]:NEG[Math.floor(Math.random()*NEG.length)];
    const d=Math.floor(Math.random()*60);
    behaviors.push({id:'B'+i,studentId:s.id,type:isP?'positive':'negative',category:c.l,points:isP?c.p:-c.p,description:'',teacher:TEACHERS[Math.floor(Math.random()*TEACHERS.length)],createdAt:now-d*864e5,archived:false});
  }
  [0,3,7,12].forEach((idx,k)=>{
    for(let j=0;j<5+k;j++){const c=NEG[j%NEG.length];
      behaviors.push({id:'BR'+k+'_'+j,studentId:students[idx].id,type:'negative',category:c.l,points:-c.p,description:'تكرار',teacher:TEACHERS[j%TEACHERS.length],createdAt:now-(j+1)*3*864e5,archived:false});
    }});
  behaviors.sort((a,b)=>b.createdAt-a.createdAt);
  return {students,behaviors};
}
let DB;
try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):seed();}catch(e){DB=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}

// ===== أدوات =====
const fmtDate=t=>new Date(t).toLocaleDateString('ar-OM',{year:'numeric',month:'short',day:'numeric'});
const timeAgo=t=>{const d=Math.floor((Date.now()-t)/864e5);return d===0?'اليوم':d===1?'أمس':'قبل '+d+' يوم'};
const getStudent=id=>DB.students.find(s=>s.id===id);

function analyze(){
  const now=Date.now();
  const in30=DB.behaviors.filter(b=>!b.archived&&now-b.createdAt<=30*864e5);
  const stats={};DB.students.forEach(s=>stats[s.id]={pos:0,neg:0});
  in30.forEach(b=>{if(stats[b.studentId]){if(b.type==='negative')stats[b.studentId].neg++;else stats[b.studentId].pos++;}});
  const risk=DB.students.map(s=>{const st=stats[s.id];const t=st.neg+st.pos;const r=t?st.neg/t:0;
    let lvl='low';if(st.neg>=4||r>=0.7)lvl='high';else if(st.neg>=2||r>=0.5)lvl='medium';
    return{...s,...st,risk:lvl};}).filter(s=>s.risk!=='low').sort((a,b)=>(b.risk==='high'?1:0)-(a.risk==='high'?1:0)||b.neg-a.neg);
  const cc={};in30.filter(b=>b.type==='negative').forEach(b=>cc[b.category]=(cc[b.category]||0)+1);
  const patterns=Object.entries(cc).map(([c,n])=>({cat:c,count:n})).sort((a,b)=>b.count-a.count).slice(0,5);
  const byGrade=GRADES.map(g=>{const gs=DB.students.filter(s=>s.grade===g).map(s=>s.id);
    return{grade:g,positive:in30.filter(b=>gs.includes(b.studentId)&&b.type==='positive').length,negative:in30.filter(b=>gs.includes(b.studentId)&&b.type==='negative').length};});
  const tp=in30.filter(b=>b.type==='positive').length,tn=in30.filter(b=>b.type==='negative').length;
  const rec=[];
  if(patterns[0]&&patterns[0].count>=5)rec.push({i:'⚠️',lv:'warn',t:'النمط "'+patterns[0].cat+'" تكرر '+patterns[0].count+' مرة. يُنصح بحملة توعوية.'});
  const hr=risk.filter(s=>s.risk==='high');
  if(hr.length)rec.push({i:'🔔',lv:'danger',t:hr.length+' طالباً في خطر مرتفع. يُقترح خطة تدخل فردية.'});
  if(tp>tn*1.5)rec.push({i:'✅',lv:'ok',t:'المؤشر إيجابي ('+tp+' تعزيز مقابل '+tn+' مخالفة).'});
  else if(tn>tp)rec.push({i:'📉',lv:'warn',t:'المخالفات ('+tn+') تتجاوز التعزيز ('+tp+').'});
  const wg=[...byGrade].sort((a,b)=>b.negative-a.negative)[0];
  if(wg&&wg.negative>5)rec.push({i:'🎯',lv:'info',t:'الصف '+wg.grade+' الأعلى مخالفات ('+wg.negative+').'});
  if(!rec.length)rec.push({i:'🟢',lv:'ok',t:'لا أنماط سلبية حرجة حالياً.'});
  return{in30,risk,patterns,byGrade,rec,tp,tn,stats};
}

// ===== الصفحات =====
let currentPage='dash';
function showPage(p){
  currentPage=p;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const active=b.dataset.page===p;
    b.className='nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm '+(active?'bg-emerald-700 text-white':'text-slate-700 hover:bg-emerald-50');
  });
  if(window.innerWidth<1024)document.getElementById('sidebar').classList.add('translate-x-full');
  render();
}

function render(){
  const el=document.getElementById('content');
  const a=analyze();
  const badge=document.getElementById('alertBadge');
  const alerts=computeAlerts();
  if(alerts.length){badge.textContent=alerts.length;badge.classList.remove('hidden');}
  else badge.classList.add('hidden');

  if(currentPage==='dash')el.innerHTML=renderDash(a);
  if(currentPage==='entry')el.innerHTML=renderEntry();
  if(currentPage==='log')el.innerHTML=renderLog();
  if(currentPage==='students')el.innerHTML=renderStudents(a);
  if(currentPage==='ai')el.innerHTML=renderAI(a);
  if(currentPage==='alerts')el.innerHTML=renderAlerts(alerts);
  if(currentPage==='reports')el.innerHTML=renderReports();
  window.scrollTo(0,0);
}

function renderDash(a){
  const recent=DB.behaviors.filter(b=>!b.archived).slice(0,6);
  return `
  <div class="space-y-6">
    <header class="flex items-center justify-between flex-wrap gap-3">
      <div><h1 class="text-2xl lg:text-3xl font-black text-slate-800">لوحة التحكم</h1>
      <p class="text-sm text-slate-500 mt-1">نظرة شاملة على السلوك الطلابي (آخر 30 يوماً)</p></div>
      <button onclick="showPage('entry')" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-5 py-3 rounded-xl">+ تسجيل سلوك</button>
    </header>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${statCard('إجمالي السجلات',a.in30.length,'📈','from-slate-700 to-slate-800',DB.behaviors.length+' سجل كلي')}
      ${statCard('إيجابية',a.tp,'✅','from-emerald-600 to-emerald-800','تعزيز ودافعية')}
      ${statCard('مخالفات',a.tn,'⚠️','from-rose-500 to-rose-600','تحتاج متابعة')}
      ${statCard('طلاب أولوية',a.risk.length,'🎯','from-amber-500 to-amber-600','خطر متوسط أو مرتفع')}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h3 class="font-black text-slate-800 mb-4">نسبة السلوك الإيجابي</h3>
        ${donut(a.tp,a.tn)}
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h3 class="font-black text-slate-800 mb-4">التوزيع حسب الصفوف</h3>
        ${gradeBars(a.byGrade)}
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-black">أحدث السلوكيات</h3>
          <button onclick="showPage('log')" class="text-xs font-bold text-emerald-700">عرض الكل ←</button>
        </div>
        <div class="space-y-2">
          ${recent.map(b=>{const s=getStudent(b.studentId);const ip=b.type==='positive';
            return `<div class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold ${ip?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-600'}">${ip?'✓':'!'}</div>
              <div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">${s?s.name:'طالب'}</div>
              <div class="text-xs text-slate-500 truncate">${b.category} · ${b.teacher}</div></div>
              <div class="text-left"><span class="text-xs font-bold px-2 py-1 rounded ${ip?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-600'}">${(ip?'+':'')+b.points}</span>
              <div class="text-[10px] text-slate-400 mt-1">${timeAgo(b.createdAt)}</div></div>
            </div>`;}).join('')}
        </div>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h3 class="font-black mb-4">🧠 توصيات ذكية</h3>
        <div class="space-y-3">
          ${a.rec.slice(0,3).map(r=>`<div class="text-xs p-3 rounded-xl border-r-4 leading-relaxed ${toneCls(r.lv)}">${r.i} ${r.t}</div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function statCard(t,v,i,grad,sub){
  return `<div class="bg-gradient-to-br ${grad} text-white rounded-2xl p-4 relative overflow-hidden">
    <div class="absolute -left-2 -bottom-2 opacity-15 text-7xl">${i}</div>
    <div class="relative"><div class="text-xs opacity-90 font-semibold">${t}</div>
    <div class="text-3xl font-black mt-1">${v}</div>
    ${sub?`<div class="text-xs mt-1 opacity-80">${sub}</div>`:''}</div></div>`;
}

function donut(pos,neg){
  const t=pos+neg||1,pct=Math.round(pos/t*100),c=2*Math.PI*42,d=pct/100*c;
  return `<div class="flex items-center gap-6">
    <svg viewBox="0 0 100 100" class="w-28 h-28 -rotate-90">
      <circle cx="50" cy="50" r="42" stroke="#FEE2E2" stroke-width="12" fill="none"/>
      <circle cx="50" cy="50" r="42" stroke="#10B981" stroke-width="12" fill="none" stroke-dasharray="${d} ${c}" stroke-linecap="round"/>
    </svg>
    <div><div class="text-3xl font-black text-emerald-700">${pct}%</div>
    <div class="text-sm text-slate-600 mt-1">نسبة السلوك الإيجابي</div>
    <div class="flex gap-3 mt-3 text-xs">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500"></span>إيجابي (${pos})</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-400"></span>سلبي (${neg})</span>
    </div></div></div>`;
}

function gradeBars(data){
  const max=Math.max(...data.map(d=>d.positive+d.negative),1);
  return `<div class="space-y-3">${data.map(d=>{const t=d.positive+d.negative,tp=t/max*100,pp=t?d.positive/t*100:0;
    return `<div class="flex items-center gap-3">
      <div class="w-14 text-sm font-bold">الصف ${d.grade}</div>
      <div class="flex-1 h-6 bg-slate-100 rounded-lg overflow-hidden">
        <div class="h-full flex" style="width:${tp}%">
          <div class="h-full bg-emerald-500" style="width:${pp}%"></div>
          <div class="h-full bg-rose-400" style="width:${100-pp}%"></div>
        </div>
      </div>
      <div class="w-16 text-left text-xs font-bold text-slate-500">${t} حالة</div>
    </div>`;}).join('')}</div>`;
}

function toneCls(lv){
  return lv==='danger'?'bg-red-50 border-red-600 text-red-900':
         lv==='warn'?'bg-amber-50 border-amber-500 text-amber-900':
         lv==='info'?'bg-blue-50 border-blue-500 text-blue-900':
         'bg-emerald-50 border-emerald-600 text-emerald-900';
}

function renderEntry(){
  return `<div class="max-w-3xl space-y-6">
    <header><h1 class="text-2xl lg:text-3xl font-black">تسجيل سلوك طالب</h1>
    <p class="text-sm text-slate-500 mt-1">نموذج إدخال سريع</p></header>
    <div id="toast" class="hidden p-4 rounded-xl font-bold text-sm"></div>
    <form id="bform" class="bg-white rounded-2xl p-6 shadow-sm space-y-5" onsubmit="submitBehavior(event)">
      <div>
        <label class="block text-sm font-bold mb-2">نوع السلوك</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="btnNeg" onclick="setType('negative')" class="p-4 rounded-xl font-bold text-sm border-2 border-red-500 bg-red-50 text-red-600">⚠️ سلبي / مخالفة</button>
          <button type="button" id="btnPos" onclick="setType('positive')" class="p-4 rounded-xl font-bold text-sm border-2 border-slate-200 text-slate-600">✅ إيجابي / تعزيز</button>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm font-bold mb-2">الطالب *</label>
          <select id="fStudent" required class="w-full rounded-xl border-2 border-slate-200 px-4 py-3 font-bold text-sm bg-white">
            <option value="">— اختر الطالب —</option>
            ${GRADES.map(g=>`<optgroup label="الصف ${g}">${DB.students.filter(s=>s.grade===g).sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(s=>`<option value="${s.id}">${s.name} — ${s.section}</option>`).join('')}</optgroup>`).join('')}
          </select>
        </div>
        <div><label class="block text-sm font-bold mb-2">المعلم *</label>
          <select id="fTeacher" class="w-full rounded-xl border-2 border-slate-200 px-4 py-3 font-bold text-sm bg-white">
            ${TEACHERS.map(t=>`<option>${t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div><label class="block text-sm font-bold mb-2">البند *</label>
        <div id="catsList" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
        <input type="hidden" id="fCat" required>
      </div>
      <div><label class="block text-sm font-bold mb-2">ملاحظات</label>
        <textarea id="fDesc" rows="3" class="w-full rounded-xl border-2 border-slate-200 px-4 py-3 text-sm" placeholder="وصف مختصر..."></textarea>
      </div>
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black py-3.5 rounded-xl">💾 حفظ التسجيل</button>
    </form>
  </div>`;
}

let currentType='negative';
function setType(t){
  currentType=t;
  const bn=document.getElementById('btnNeg'),bp=document.getElementById('btnPos');
  if(t==='negative'){
    bn.className='p-4 rounded-xl font-bold text-sm border-2 border-red-500 bg-red-50 text-red-600';

function exportCSV(){

  DB.behaviors.forEach(b=>{const s=getStudent(b.studentId);

function computeAlerts(){
  const now=Date.now();
  const in30=DB.behaviors.filter(b=>!b.archived&&now-b.createdAt<=30*864e5);
  const bs={};in30.forEach(b=>{if(!bs[b.studentId])bs[b.studentId]={neg:0,pos:0};
    if(b.type==='negative')bs[b.studentId].neg++;else bs[b.studentId].pos++;});
  const list=[];
  Object.entries(bs).forEach(([sid,s])=>{const st=getStudent(sid);if(!st)return;
    if(s.neg>=3)list.push({id:sid+'_risk',sev:s.neg>=5?'high':'medium',ti:'استدعاء ولي أمر',m:st.name+' (الصف '+st.grade+') لديه '+s.neg+' مخالفات خلال 30 يوماً.'});
    if(s.neg>s.pos*2&&s.neg>=2)list.push({id:sid+'_trend',sev:'medium',ti:'تراجع في السلوك الإيجابي',m:st.name+' يسجل '+s.neg+' مخالفة مقابل '+s.pos+' تعزيز.'});
  });
  return list;
}
