<head>
<meta charset="UTF-8">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','sans-serif']},
colors:{primary:{DEFAULT:'#047857',light:'#10B981',dark:'#065F46',soft:'#ECFDF5'},
accent:{DEFAULT:'#F59E0B',soft:'#FEF3C7'},danger:{DEFAULT:'#DC2626',soft:'#FEE2E2'}}}}}

body{font-family:'Cairo',sans-serif;background:#F8FAFC}
.fade-in{animation:f .3s}@keyframes f{from{opacity:0}to{opacity:1}}
@media print{.no-print{display:none!important}}

<body>
<div id="root"></div>
<script>
const {useState,useEffect,useMemo,useCallback}=React;
const html=htm.bind(React.createElement);
const GRADES=[5,6,7,8,9],SECTIONS=['أ','ب','ج'];
const POS=[{id:'p1',l:'مشاركة فعالة في الحصة',p:2},{id:'p2',l:'مساعدة زميل',p:3},
{id:'p3',l:'الالتزام بالواجبات',p:2},{id:'p4',l:'سلوك متميز في الطابور',p:2},
{id:'p5',l:'تحسن ملحوظ في الأداء',p:4},{id:'p6',l:'مبادرة إيجابية متميزة',p:3},
{id:'p7',l:'المحافظة على النظافة',p:2},{id:'p8',l:'تمثيل المدرسة في نشاط',p:5}];
const NEG=[{id:'n1',l:'تأخر عن الحصة',p:1},{id:'n2',l:'عدم إحضار الأدوات',p:2},
{id:'n3',l:'إزعاج الصف',p:2},{id:'n4',l:'التلفظ بألفاظ غير لائقة',p:3},
{id:'n5',l:'التخلف عن الطابور',p:1},{id:'n6',l:'مشاجرة مع زميل',p:5},
{id:'n7',l:'إتلاف ممتلكات المدرسة',p:5},{id:'n8',l:'الغياب بدون عذر',p:3},
{id:'n9',l:'استخدام الهاتف داخل الصف',p:3},{id:'n10',l:'عدم تنفيذ التوجيهات',p:2}];
const NAMES=['أحمد بن سالم الرواحي','محمد بن خالد البلوشي','يوسف بن علي المعمري',
'عبدالله بن حمد الحارثي','سعيد بن راشد الكندي','خالد بن ناصر الفارسي',
'سلطان بن ماجد الشكيلي','حمزة بن ياسر العامري','طلال بن سعيد الهنائي',
'فهد بن عبدالرحمن الزدجالي','بدر بن سليمان الريامي','مازن بن حمدان الحجري',
'معاذ بن طارق السعدي','أيمن بن وليد المقبالي','راشد بن سيف الخروصي',
'هلال بن منصور الغافري','نبيل بن عامر الحوسني','قيس بن مروان الوهيبي',
'زياد بن فارس اليعقوبي','مروان بن أيمن السيابي','حاتم بن صالح العبري',
'عمار بن نبيل الجابري','أنس بن كمال الرئيسي','بلال بن هيثم المخيني',
'جعفر بن عادل الشعيلي','كرم بن رامي الصوافي','ليث بن جابر الحسني',
'مصعب بن أنور البوسعيدي','نزار بن صقر الهاشمي','وسام بن فاروق الأغبري',
'ياسر بن رمزي العجمي','يعقوب بن إسحاق النعماني','أسامة بن زهير الكلباني',
'إبراهيم بن نوح المسروري','إسماعيل بن ياسين الحبسي','بشار بن حكيم الشيباني',
'تمام بن سامي البطاشي','ثامر بن سليمان القريني','جاسم بن جابر العويسي',
'حسام بن لؤي المزروعي','رشيد بن عامر البلوشي','سامر بن منير الحديدي',
'شادي بن بشير اللواتي','صفوان بن رشيد الرحبي','طلحة بن زياد الفليتي',
'عبيد بن مبارك الوائلي','غيث بن هلال المحروقي','فيصل بن جمعة الروشدي'];
const TEACHERS=['أ. سعيد العامري','أ. خالد البلوشي','أ. محمد المعمري',
'أ. يوسف الحارثي','أ. أحمد الرواحي','أ. حمود الكندي','أ. راشد الفارسي','أ. سالم الشكيلي'];

function seed(){
  const students=NAMES.map((n,i)=>({id:'S'+String(i+1).padStart(3,'0'),name:n,
    grade:GRADES[i%5],section:SECTIONS[i%3],guardian:'ولي أمر '+n.split(' ')[0],
    phone:'9'+(1000000+Math.floor(Math.random()*8999999))}));
  const behaviors=[];const now=Date.now();
  for(let i=0;i<220;i++){
    const s=students[Math.floor(Math.random()*students.length)];
    const isP=Math.random()<0.6;
    const c=isP?POS[Math.floor(Math.random()*POS.length)]:NEG[Math.floor(Math.random()*NEG.length)];
    const days=Math.floor(Math.random()*60);
    behaviors.push({id:'B'+i,studentId:s.id,type:isP?'positive':'negative',
      category:c.l,points:isP?c.p:-c.p,description:'',teacher:TEACHERS[Math.floor(Math.random()*TEACHERS.length)],
      createdAt:now-days*864e5-Math.floor(Math.random()*864e5),archived:false});
  }
  [0,3,7,12].forEach((idx,k)=>{
    for(let j=0;j<5+k;j++){
      const c=NEG[j%NEG.length];
      behaviors.push({id:'BR'+k+'_'+j,studentId:students[idx].id,type:'negative',
        category:c.l,points:-c.p,description:'تكرار',teacher:TEACHERS[j%TEACHERS.length],
        createdAt:now-(j+1)*3*864e5,archived:false});
    }
  });
  behaviors.sort((a,b)=>b.createdAt-a.createdAt);
  return {students,behaviors};
}
const KEY='almasaa_v2';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
const fmtDate=t=>new Date(t).toLocaleDateString('ar-OM',{year:'numeric',month:'short',day:'numeric'});
const timeAgo=t=>{const d=Math.floor((Date.now()-t)/864e5);return d===0?'اليوم':d===1?'أمس':'قبل '+d+' يوم'};

function analyze(students,behaviors){
  const now=Date.now();
  const in30=behaviors.filter(b=>!b.archived&&now-b.createdAt<=30*864e5);
  const smap=Object.fromEntries(students.map(s=>[s.id,s]));
  const stats={};
  students.forEach(s=>stats[s.id]={neg:0,pos:0});
  in30.forEach(b=>{if(stats[b.studentId]){if(b.type==='negative')stats[b.studentId].neg++;else stats[b.studentId].pos++;}});
  const risk=students.map(s=>{const st=stats[s.id];const t=st.neg+st.pos;
    const r=t?st.neg/t:0;let lvl='low';
    if(st.neg>=4||r>=0.7)lvl='high';else if(st.neg>=2||r>=0.5)lvl='medium';
    return{...s,...st,negRatio:r,risk:lvl};}).filter(s=>s.risk!=='low')
    .sort((a,b)=>(b.risk==='high'?1:0)-(a.risk==='high'?1:0)||b.neg-a.neg);
  const cc={};in30.filter(b=>b.type==='negative').forEach(b=>{cc[b.category]=(cc[b.category]||0)+1;});
  const patterns=Object.entries(cc).map(([cat,count])=>({cat,count})).sort((a,b)=>b.count-a.count).slice(0,5);
  const byGrade=GRADES.map(g=>({grade:g,
    positive:in30.filter(b=>{const s=smap[b.studentId];return s&&s.grade===g&&b.type==='positive'}).length,
    negative:in30.filter(b=>{const s=smap[b.studentId];return s&&s.grade===g&&b.type==='negative'}).length}));
  const tp=in30.filter(b=>b.type==='positive').length,tn=in30.filter(b=>b.type==='negative').length;
  const rec=[];
  if(patterns[0]&&patterns[0].count>=5)rec.push({i:'⚠️',lv:'warn',t:`النمط "${patterns[0].cat}" تكرر ${patterns[0].count} مرة. يُنصح بحملة توعوية.`});
  const hr=risk.filter(s=>s.risk==='high');
  if(hr.length)rec.push({i:'🔔',lv:'danger',t:`${hr.length} طالباً في خطر مرتفع. يُقترح خطة تدخل فردية مع المرشد.`});
  if(tp>tn*1.5)rec.push({i:'✅',lv:'ok',t:`المؤشر إيجابي (${tp} تعزيز مقابل ${tn} مخالفة). استمروا بتعزيز الدافعية.`});
  else if(tn>tp)rec.push({i:'📉',lv:'warn',t:`المخالفات (${tn}) تتجاوز التعزيز (${tp}). راجعوا لائحة السلوك.`});
  const wg=[...byGrade].sort((a,b)=>b.negative-a.negative)[0];
  if(wg&&wg.negative>5)rec.push({i:'🎯',lv:'info',t:`الصف ${wg.grade} الأعلى مخالفات (${wg.negative}). اجتماع مع مربي الصف.`});
  if(!rec.length)rec.push({i:'🟢',lv:'ok',t:'لا أنماط سلبية حرجة حالياً.'});
  return{in30,risk,patterns,byGrade,rec,tp,tn};
}

function Badge({c='slate',children}){
  const cls={slate:'bg-slate-100 text-slate-700',green:'bg-primary-soft text-primary-dark',
    red:'bg-danger-soft text-danger',amber:'bg-accent-soft text-amber-800',
    blue:'bg-blue-100 text-blue-700'}[c];
  return html`<span className="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold ${cls}">${children}</span>`;}

function Logo(){
  return html`<div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center flex-shrink-0">
    <svg viewBox="0 0 24 24" className="w-7 h-7"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="#F59E0B" opacity="0.3"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" strokeWidth="2" fill="none" strokeLinejoin="round"/></svg>
  </div>`;}

function StatCard({title,value,icon,tone='primary',sub}){
  const t={primary:'from-primary to-primary-dark',accent:'from-amber-500 to-amber-600',
    danger:'from-rose-500 to-rose-600',slate:'from-slate-700 to-slate-800'}[tone];
  return html`<div className="bg-gradient-to-br ${t} text-white rounded-2xl p-5 relative overflow-hidden">
    <div className="absolute -left-4 -bottom-4 opacity-15 text-8xl">${icon}</div>
    <div className="relative">
      <div className="text-xs font-semibold opacity-90">${title}</div>
      <div className="text-3xl font-black mt-2">${value}</div>
      ${sub&&html`<div className="text-xs mt-1 opacity-80">${sub}</div>`}
    </div>
  </div>`;}

function Donut({pos,neg}){
  const t=pos+neg||1,pct=Math.round(pos/t*100),circ=2*Math.PI*42,dash=pct/100*circ;
  return html`<div className="flex items-center gap-6">
    <svg viewBox="0 0 100 100" className="w-32 h-32 -rotate-90">
      <circle cx="50" cy="50" r="42" stroke="#FEE2E2" strokeWidth="12" fill="none"/>
      <circle cx="50" cy="50" r="42" stroke="#10B981" strokeWidth="12" fill="none"
        strokeDasharray="${dash} ${circ}" strokeLinecap="round"/>
    </svg>
    <div>
      <div className="text-3xl font-black text-primary">${pct}%</div>
      <div className="text-sm text-slate-600 mt-1">نسبة السلوك الإيجابي</div>
      <div className="flex items-center gap-3 mt-3 text-xs">
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-primary-light"></span>إيجابي (${pos})</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-rose-400"></span>سلبي (${neg})</span>
      </div>
    </div>
  </div>`;}

function GradeBars({data}){
  const max=Math.max(...data.map(d=>d.positive+d.negative),1);
  return html`<div className="space-y-3">
    ${data.map(d=>{const t=d.positive+d.negative,tp=t/max*100,pp=t?d.positive/t*100:0;
      return html`<div key=${d.grade} className="flex items-center gap-3">
        <div className="w-14 text-sm font-bold text-slate-700">الصف ${d.grade}</div>
        <div className="flex-1 h-6 bg-slate-100 rounded-lg overflow-hidden">
          <div className="h-full flex" style=${{width:tp+'%'}}>
            <div className="h-full bg-primary-light" style=${{width:pp+'%'}}></div>
            <div className="h-full bg-rose-400" style=${{width:(100-pp)+'%'}}></div>
          </div>
        </div>
        <div className="w-16 text-left text-xs font-bold text-slate-500">${t} حالة</div>
      </div>`;})}
  </div>`;}

const NAV=[{id:'dash',l:'لوحة التحكم',i:'📊'},{id:'entry',l:'تسجيل سلوك',i:'✍️'},
{id:'log',l:'سجل السلوكيات',i:'📋'},{id:'students',l:'الطلبة',i:'👥'},
{id:'ai',l:'الإرشاد الذكي',i:'🧠'},{id:'alerts',l:'التنبيهات',i:'🔔'},{id:'reports',l:'التقارير',i:'📄'}];

function Sidebar({page,setPage,ac}){
  const [open,setOpen]=useState(false);
  return html`<>
    <button onClick=${()=>setOpen(!open)} className="lg:hidden fixed top-4 right-4 z-50 bg-primary text-white p-3 rounded-xl shadow-lg">☰</button>
    <aside className=${'fixed lg:static top-0 right-0 h-screen w-72 bg-white border-l border-slate-200 z-40 transform transition-transform '+(open?'translate-x-0':'translate-x-full lg:translate-x-0')+' flex flex-col'}>
      <div className="p-5 border-b border-slate-100 flex items-center gap-3">
        <${Logo}/>
        <div><div className="font-black text-primary leading-tight text-sm">مدرسة المسعى</div>
        <div className="text-xs text-slate-500">للتعليم الأساسي للبنين ٥-٩</div></div>
      </div>
      <nav className="flex-1 overflow-y-auto p-3 space-y-1">
        ${NAV.map(it=>html`<button key=${it.id} onClick=${()=>{setPage(it.id);setOpen(false)}}
          className=${'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition '+(page===it.id?'bg-primary text-white':'text-slate-700 hover:bg-primary-soft')}>
          <span className="text-lg">${it.i}</span><span className="flex-1 text-right">${it.l}</span>
          ${it.id==='alerts'&&ac>0&&html`<span className="bg-danger text-white text-xs font-black rounded-full min-w-[22px] h-5 flex items-center justify-center px-1.5">${ac}</span>`}
        </button>`)}
      </nav>
      <div className="p-4 border-t text-center text-[10px] text-slate-400">منصة إدارة السلوك · v2.0</div>
    </aside>
    ${open&&html`<div onClick=${()=>setOpen(false)} className="lg:hidden fixed inset-0 bg-black/40 z-30"></div>`}
  </>`;}

function Dashboard({students,behaviors,nav}){
  const a=useMemo(()=>analyze(students,behaviors),[students,behaviors]);
  const recent=behaviors.filter(b=>!b.archived).slice(0,6);
  const smap=Object.fromEntries(students.map(s=>[s.id,s]));
  return html`<div className="space-y-6 fade-in">
    <header className="flex items-center justify-between flex-wrap gap-3">
      <div><h1 className="text-2xl lg:text-3xl font-black text-slate-800">لوحة التحكم</h1>
      <p className="text-sm text-slate-500 mt-1">نظرة شاملة على السلوك الطلابي (آخر 30 يوماً)</p></div>
      <button onClick=${()=>nav('entry')} className="bg-primary hover:bg-primary-dark text-white font-bold px-5 py-3 rounded-xl">+ تسجيل سلوك</button>
    </header>
    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <${StatCard} title="إجمالي السجلات" value=${a.in30.length} icon="📈" tone="slate" sub=${behaviors.length+' سجل كلي'}/>
      <${StatCard} title="سلوكيات إيجابية" value=${a.tp} icon="✅" tone="primary" sub="تعزيز ودافعية"/>
      <${StatCard} title="مخالفات لائحية" value=${a.tn} icon="⚠️" tone="danger" sub="تحتاج متابعة"/>
      <${StatCard} title="طلاب أولوية" value=${a.risk.length} icon="🎯" tone="accent" sub="خطر متوسط أو مرتفع"/>
    </div>
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div className="bg-white rounded-2xl p-6 shadow-sm">
        <h3 className="font-black text-slate-800 mb-4">نسبة السلوك الإيجابي</h3>
        <${Donut} pos=${a.tp} neg=${a.tn}/>
      </div>
      <div className="bg-white rounded-2xl p-6 shadow-sm">
        <h3 className="font-black text-slate-800 mb-4">التوزيع حسب الصفوف</h3>
        <${GradeBars} data=${a.byGrade}/>
      </div>
    </div>
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-black text-slate-800">أحدث السلوكيات</h3>
          <button onClick=${()=>nav('log')} className="text-xs font-bold text-primary">عرض الكل ←</button>
        </div>
        <div className="space-y-2">
          ${recent.map(b=>{const s=smap[b.studentId],ip=b.type==='positive';
            return html`<div key=${b.id} className="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50">
              <div className=${'w-10 h-10 rounded-xl flex items-center justify-center font-bold '+(ip?'bg-primary-soft text-primary-dark':'bg-danger-soft text-danger')}>${ip?'✓':'!'}</div>
              <div className="flex-1 min-w-0"><div className="font-bold text-sm truncate">${s?s.name:'طالب'}</div>
              <div className="text-xs text-slate-500 truncate">${b.category} · ${b.teacher}</div></div>
              <div className="text-left"><${Badge} c=${ip?'green':'red'}>${(ip?'+':'')+b.points}<//>
              <div className="text-[10px] text-slate-400 mt-1">${timeAgo(b.createdAt)}</div></div>
            </div>`;})}
        </div>
      </div>
      <div className="bg-white rounded-2xl p-6 shadow-sm">
        <h3 className="font-black text-slate-800 mb-4">🧠 توصيات ذكية</h3>
        <div className="space-y-3">
          ${a.rec.slice(0,3).map((r,i)=>html`<div key=${i} className=${'text-xs p-3 rounded-xl border-r-4 leading-relaxed '+(r.lv==='danger'?'bg-danger-soft border-danger text-rose-900':r.lv==='warn'?'bg-accent-soft border-accent text-amber-900':r.lv==='info'?'bg-blue-50 border-blue-500 text-blue-900':'bg-primary-soft border-primary text-primary-dark')}>
            <span className="ml-1">${r.i}</span>${r.t}</div>`)}
        </div>
        <button onClick=${()=>nav('ai')} className="w-full mt-4 text-xs font-bold text-primary hover:bg-primary-soft py-2 rounded-lg">عرض التحليل الكامل ←</button>
      </div>
    </div>
  </div>`;}

function Entry({students,onAdd}){
  const [type,setType]=useState('negative');
  const [sid,setSid]=useState('');const [cid,setCid]=useState('');
  const [desc,setDesc]=useState('');const [teacher,setTeacher]=useState(TEACHERS[0]);
  const [toast,setToast]=useState(null);
  const cats=type==='positive'?POS:NEG;
  const sorted=[...students].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const submit=e=>{
    e.preventDefault();
    if(!sid||!cid){setToast({t:'error',m:'يرجى استكمال الحقول'});setTimeout(()=>setToast(null),2500);return;}
    const c=cats.find(x=>x.id===cid);
    onAdd({studentId:sid,type,category:c.l,points:type==='positive'?c.p:-c.p,description:desc,teacher});
    setToast({t:'ok',m:'✓ تم التسجيل'});setTimeout(()=>setToast(null),2500);
    setSid('');setCid('');setDesc('');
  };
  return html`<div className="space-y-6 fade-in max-w-3xl">
    <header><h1 className="text-2xl lg:text-3xl font-black text-slate-800">تسجيل سلوك طالب</h1>
    <p className="text-sm text-slate-500 mt-1">نموذج إدخال سريع</p></header>
    ${toast&&html`<div className=${'p-4 rounded-xl font-bold text-sm '+(toast.t==='ok'?'bg-primary-soft text-primary-dark':'bg-danger-soft text-danger')}>${toast.m}</div>`}
    <form onSubmit=${submit} className="bg-white rounded-2xl p-6 shadow-sm space-y-5">
      <div>
        <label className="block text-sm font-bold text-slate-700 mb-2">نوع السلوك</label>
        <div className="grid grid-cols-2 gap-3">
          <button type="button" onClick=${()=>{setType('positive');setCid('')}} className=${'p-4 rounded-xl font-bold text-sm border-2 transition '+(type==='positive'?'border-primary bg-primary-soft text-primary-dark':'border-slate-200 text-slate-600')}>✅ إيجابي / تعزيز</button>
          <button type="button" onClick=${()=>{setType('negative');setCid('')}} className=${'p-4 rounded-xl font-bold text-sm border-2 transition '+(type==='negative'?'border-danger bg-danger-soft text-danger':'border-slate-200 text-slate-600')}>⚠️ سلبي / مخالفة</button>
        </div>
      </div>

      if(s.neg>s.pos*2&&s.neg>=2)list.push({id:sid+'_trend',sid,sev:'medium',ti:'تراجع في السلوك الإيجابي',
        m:st.name+' يسجل '+s.neg+' مخالفة مقابل '+s.pos+' تعزيز. تدخل إرشادي.'});

  const genS=()=>{if(!ssid)return alert('اختر الطالب');
    const st=smap[ssid],bs=behaviors.filter(b=>b.studentId===ssid&&!b.archived).sort((a,b)=>b.createdAt-a.createdAt);
    const pos=bs.filter(b=>b.type==='positive').length,neg=bs.filter(b=>b.type==='negative').length;
    const bal=bs.reduce((s,b)=>s+b.points,0);
    setPrev({k:'s',student:st,behaviors:bs,stats:{pos,neg,bal}});};
  const genG=()=>{const gs=students.filter(s=>s.grade===sg),ids=new Set(gs.map(s=>s.id));
    const bs=behaviors.filter(b=>ids.has(b.studentId)&&!b.archived);
    const rows=gs.map(s=>{const sbs=bs.filter(b=>b.studentId===s.id);
      return{...s,pos:sbs.filter(b=>b.type==='positive').length,neg:sbs.filter(b=>b.type==='negative').length,
        bal:sbs.reduce((a,b)=>a+b.points,0)};}).sort((a,b)=>b.bal-a.bal);
    setPrev({k:'g',grade:sg,rows});};
  return html`<div className="space-y-6 fade-in">
    <header className="no-print"><h1 className="text-2xl lg:text-3xl font-black text-slate-800">📄 التقارير الرسمية</h1>
    <p className="text-sm text-slate-500 mt-1">تقارير فردية وجماعية قابلة للطباعة</p></header>
    <div className="bg-white rounded-2xl p-6 shadow-sm no-print">
      <div className="flex gap-2 mb-6">
        <button onClick=${()=>{setType('student');setPrev(null)}} className=${'flex-1 py-3 rounded-xl font-bold text-sm '+(type==='student'?'bg-primary text-white':'bg-slate-100')}>👤 تقرير طالب</button>
        <button onClick=${()=>{setType('grade');setPrev(null)}} className=${'flex-1 py-3 rounded-xl font-bold text-sm '+(type==='grade'?'bg-primary text-white':'bg-slate-100')}>👥 تقرير صف</button>
      </div>
      ${type==='student'?html`<div className="space-y-4">
        <select value=${ssid} onChange=${e=>setSsid(e.target.value)} className="w-full rounded-xl border-2 border-slate-200 px-4 py-3 font-bold text-sm bg-white focus:border-primary focus:outline-none">
          <option value="">— اختر الطالب —</option>
          ${GRADES.map(g=>html`<optgroup key=${g} label=${'الصف '+g}>
            ${students.filter(s=>s.grade===g).map(s=>html`<option key=${s.id} value=${s.id}>${s.name} — ${s.section}</option>`)}
          </optgroup>`)}
        </select>
        <button onClick=${genS} className="w-full bg-primary hover:bg-primary-dark text-white font-black py-3 rounded-xl">🔍 توليد</button>
      </div>`:html`<div className="space-y-4">
        <div className="grid grid-cols-5 gap-2">
          ${GRADES.map(g=>html`<button key=${g} onClick=${()=>setSg(g)} className=${'py-3 rounded-xl font-bold text-sm '+(sg===g?'bg-primary text-white':'bg-slate-100')}>الصف ${g}</button>`)}
        </div>
        <button onClick=${genG} className="w-full bg-primary hover:bg-primary-dark text-white font-black py-3 rounded-xl">🔍 توليد</button>
      </div>`}
    </div>
    ${prev&&html`<div className="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div className="p-4 bg-slate-50 border-b flex justify-between no-print">
        <span className="text-sm font-bold">معاينة</span>
        <div className="flex gap-2">
          <button onClick=${()=>window.print()} className="bg-primary text-white font-bold px-4 py-2 rounded-lg text-xs">🖨️ طباعة / PDF</button>
          <button onClick=${()=>setPrev(null)} className="bg-slate-200 font-bold px-4 py-2 rounded-lg text-xs">إغلاق</button>
        </div>
      </div>
      <div className="p-8">
        <div className="text-center border-b-4 border-primary pb-4 mb-6">
          <div className="font-black text-xl text-primary">مدرسة المسعى للتعليم الأساسي للبنين (٥-٩)</div>
          <div className="text-xs text-slate-500 mt-1">وزارة التربية والتعليم — سلطنة عُمان</div>
          <div className="text-lg font-black mt-3">${prev.k==='s'?'تقرير السلوك الطلابي':'تقرير السلوك الجماعي — الصف '+prev.grade}</div>
          <div className="text-xs text-slate-500 mt-1">${new Date().toLocaleDateString('ar-OM',{year:'numeric',month:'long',day:'numeric'})}</div>
        </div>
        ${prev.k==='s'?html`<>
          <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
            <div><span className="font-bold text-slate-500">الطالب:</span> <span className="font-black">${prev.student.name}</span></div>
            <div><span className="font-bold text-slate-500">الصف:</span> <span className="font-black">${prev.student.grade} / ${prev.student.section}</span></div>
            <div><span className="font-bold text-slate-500">ولي الأمر:</span> <span className="font-black">${prev.student.guardian}</span></div>
            <div><span className="font-bold text-slate-500">الهاتف:</span> <span className="font-black">${prev.student.phone}</span></div>
          </div>
          <div className="grid grid-cols-3 gap-3 mb-6">
            <div className="bg-primary-soft rounded-xl p-3 text-center"><div className="text-xs font-bold text-primary-dark">تعزيزات</div><div className="text-2xl font-black text-primary">${prev.stats.pos}</div></div>
            <div className="bg-danger-soft rounded-xl p-3 text-center"><div className="text-xs font-bold text-danger">مخالفات</div><div className="text-2xl font-black text-danger">${prev.stats.neg}</div></div>
            <div className="bg-slate-100 rounded-xl p-3 text-center"><div className="text-xs font-bold text-slate-600">الرصيد</div><div className=${'text-2xl font-black '+(prev.stats.bal>=0?'text-primary':'text-danger')}>${prev.stats.bal}</div></div>
          </div>
          <table className="w-full text-xs border-collapse">
            <thead><tr className="bg-primary text-white">
              <th className="border border-slate-300 px-2 py-2">التاريخ</th><th className="border border-slate-300 px-2 py-2">النوع</th>
              <th className="border border-slate-300 px-2 py-2">البند</th><th className="border border-slate-300 px-2 py-2">النقاط</th>
              <th className="border border-slate-300 px-2 py-2">المعلم</th>
            </tr></thead>
            <tbody>${prev.behaviors.slice(0,25).map(b=>html`<tr key=${b.id}>
              <td className="border px-2 py-1.5 text-center">${fmtDate(b.createdAt)}</td>
              <td className="border px-2 py-1.5 text-center">${b.type==='positive'?'إيجابي':'سلبي'}</td>
              <td className="border px-2 py-1.5">${b.category}</td>
              <td className=${'border px-2 py-1.5 text-center font-bold '+(b.type==='positive'?'text-primary':'text-danger')}>${b.points>0?'+':''}${b.points}</td>
              <td className="border px-2 py-1.5 text-center">${b.teacher}</td>
            </tr>`)}</tbody>
          </table>
        </>`:html`<table className="w-full text-xs border-collapse">
          <thead><tr className="bg-primary text-white">
            <th className="border px-2 py-2">#</th><th className="border px-2 py-2">الطالب</th>
            <th className="border px-2 py-2">الفصل</th><th className="border px-2 py-2">تعزيزات</th>
            <th className="border px-2 py-2">مخالفات</th><th className="border px-2 py-2">الرصيد</th>
          </tr></thead>
          <tbody>${prev.rows.map((s,i)=>html`<tr key=${s.id}>
            <td className="border px-2 py-1.5 text-center">${i+1}</td>
            <td className="border px-2 py-1.5 font-bold">${s.name}</td>
            <td className="border px-2 py-1.5 text-center">${s.section}</td>
            <td className="border px-2 py-1.5 text-center text-primary font-bold">${s.pos}</td>
            <td className="border px-2 py-1.5 text-center text-danger font-bold">${s.neg}</td>
            <td className=${'border px-2 py-1.5 text-center font-black '+(s.bal>=0?'text-primary':'text-danger')}>${s.bal}</td>
          </tr>`)}</tbody>
        </table>`}
        <div className="mt-10 flex justify-between text-xs">
          <div className="text-center"><div className="font-bold mb-12">توقيع الأخصائي</div><div className="border-t border-slate-400 pt-1 px-8">.................</div></div>
          <div className="text-center"><div className="font-bold mb-12">توقيع المدير</div><div className="border-t border-slate-400 pt-1 px-8">.................</div></div>
        </div>
      </div>
    </div>`}
  </div>`;}

function App(){
  const [state,setState]=useState(load);
  const [page,setPage]=useState('dash');
  const [resolved,setResolved]=useState([]);
  useEffect(()=>save(state),[state]);
  const {students,behaviors}=state;
  const add=useCallback(b=>setState(s=>({...s,behaviors:[{id:'B'+Date.now(),...b,createdAt:Date.now(),archived:false},...s.behaviors]})),[]);
  const arch=useCallback(id=>setState(s=>({...s,behaviors:s.behaviors.map(b=>b.id===id?{...b,archived:!b.archived}:b)})),[]);
  const del=useCallback(id=>setState(s=>({...s,behaviors:s.behaviors.filter(b=>b.id!==id)})),[]);
  const ac=useMemo(()=>{const now=Date.now();
    const in30=behaviors.filter(b=>!b.archived&&now-b.createdAt<=30*864e5);
    const bs={};in30.forEach(b=>{if(!bs[b.studentId])bs[b.studentId]={neg:0,pos:0};
      if(b.type==='negative')bs[b.studentId].neg++;else bs[b.studentId].pos++;});
    let c=0;Object.entries(bs).forEach(([sid,s])=>{
      if(s.neg>=3&&!resolved.includes(sid+'_risk'))c++;
      if(s.neg>s.pos*2&&s.neg>=2&&!resolved.includes(sid+'_trend'))c++;});
    return c;},[behaviors,resolved]);
  return html`<div className="min-h-screen flex flex-row-reverse bg-slate-50">
    <${Sidebar} page=${page} setPage=${setPage} ac=${ac}/>
    <main className="flex-1 overflow-x-hidden">
      <div className="p-4 lg:p-8 pt-20 lg:pt-8">
        ${page==='dash'&&html`<${Dashboard} students=${students} behaviors=${behaviors} nav=${setPage}/>`}
        ${page==='entry'&&html`<${Entry} students=${students} onAdd=${add}/>`}
        ${page==='log'&&html`<${Log} students=${students} behaviors=${behaviors} onArch=${arch} onDel=${del}/>`}
        ${page==='students'&&html`<${Students} students=${students} behaviors=${behaviors}/>`}
        ${page==='ai'&&html`<${AI} students=${students} behaviors=${behaviors}/>`}
        ${page==='alerts'&&html`<${Alerts} students=${students} behaviors=${behaviors} resolved=${resolved} onResolve=${id=>setResolved(r=>[...r,id])}/>`}
        ${page==='reports'&&html`<${Reports} students=${students} behaviors=${behaviors}/>`}
      </div>
    </main>
  </div>`;}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
