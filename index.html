<style>
/* ============ المتغيرات ============ */
:root{
  --c-primary:#047857;--c-light:#10B981;--c-dark:#065F46;--c-soft:#ECFDF5;

}
body{font-family:var(--font),system-ui,sans-serif;background:var(--c-bg);margin:0;font-size:var(--fsize);min-height:100vh;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><g fill='none' stroke='%23047857' stroke-width='1.5'><path d='M30 40 L70 40 L70 80 L30 80 Z'/><circle cx='140' cy='50' r='20'/><path d='M30 120 L80 120 L80 140 L30 140 Z'/><path d='M150 100 L150 140 M130 120 L170 120'/></g></svg>");
  background-size:280px}
body.s-small{font-size:13px}body.s-medium{font-size:15px}body.s-large{font-size:17px}body.s-xl{font-size:19px}

/* ألوان ديناميكية */
.bg-p{background:var(--c-primary)!important}.bg-pl{background:var(--c-light)!important}.bg-ps{background:var(--c-soft)!important}
.text-p{color:var(--c-primary)!important}.text-pd{color:var(--c-dark)!important}
.border-p{border-color:var(--c-primary)!important}
.hover\:bg-p:hover{background:var(--c-primary)!important}
.bg-grad{background-image:linear-gradient(135deg,var(--c-primary),var(--c-dark))!important}

/* طبقات */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;overflow-y:auto;backdrop-filter:blur(4px)}
.dropdown{position:absolute;top:100%;right:0;left:0;background:white;border:2px solid var(--c-primary);border-top:none;border-radius:0 0 12px 12px;max-height:300px;overflow-y:auto;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.ditem{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background .15s}
.ditem:hover{background:var(--c-soft)}.ditem.sel{background:var(--c-soft);font-weight:700}

/* بطاقات */
.card{transition:all .25s}.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px -8px rgba(0,0,0,.18)}
.icon-box{display:flex;align-items:center;justify-content:center;border-radius:14px;box-shadow:0 4px 12px -2px rgba(0,0,0,.12)}

/* Hero */
.hero{background:linear-gradient(135deg,var(--c-primary),var(--c-dark));position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:60%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%}

/* مساعدة */
.help{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--c-soft);color:var(--c-primary);border-radius:50%;font-size:11px;font-weight:900;cursor:pointer;border:1.5px solid var(--c-primary);margin-right:6px}
.tip{position:fixed;background:#1e293b;color:white;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:600;max-width:220px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.2)}

.sec-title{font-weight:900;padding-right:12px;border-right:4px solid var(--c-primary);margin-bottom:12px}

@media print{.no-print{display:none!important}}
</style>
</head>

/* =================================================================
   3) التخزين
   ================================================================= */
const KEY='almasaa_v8';
const BK_KEY='almasaa_bk';
let DB;
try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):null}catch(e){DB=null}

function seed(){
  const students=DEF_STU.map(([name,g,s],i)=>({id:'S'+String(i+1).padStart(3,'0'),name,grade:g,section:s,phone:''}));
  return {
    config:{...DEF_CFG},
    users:JSON.parse(JSON.stringify(DEF_USERS)),
    students,
    behaviors:JSON.parse(JSON.stringify(DEF_BEH)),
    actions:JSON.parse(JSON.stringify(DEF_ACT)),
    health:[],
    referrals:[],
    records:[],
    followups:[],
    resolved:[]
  };
}
if(!DB)DB=seed();

// ترحيل

  'principalTitle','healthVisitorName','healthVisitorTitle','waBehavior','waHealth','healthRecipient',
  'healthGreeting','healthBody','healthClosing','healthReturnNote'];
migrations.forEach(k=>{if(DB.config[k]===undefined)DB.config[k]=DEF_CFG[k]});
if(!DB.health)DB.health=[];
if(!DB.referrals)DB.referrals=[];
if(!DB.followups)DB.followups=[];
if(!DB.resolved)DB.resolved=[];
if(!DB.users.some(u=>u.isAdmin))DB.users.unshift({id:'U0',name:'مدير النظام',title:'مدير',username:'almasaa',password:'123456',isAdmin:true});

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
  backupTick();
  if(typeof cloudPush==='function'&&CLOUD.enabled)cloudPush();
}
function uid(p){return p+Date.now()+Math.floor(Math.random()*1000)}

/* =================================================================
   4) أدوات
   ================================================================= */
const fmtD=t=>new Date(t).toLocaleDateString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit'});
const fmtDT=t=>new Date(t).toLocaleString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d===0?'اليوم':d===1?'أمس':'قبل '+d+' يوم'};
const gS=id=>DB.students.find(s=>s.id===id);
const gB=id=>DB.behaviors.find(b=>b.id===id);
const gA=id=>DB.actions.find(a=>a.id===id);
const gU=id=>DB.users.find(u=>u.id===id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayFull=()=>new Date().toLocaleDateString('ar-OM',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const todayShort=()=>new Date().toLocaleDateString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit'});

function tip(text){
  const id='t'+Math.random().toString(36).slice(2);
  return `<span class="help" onclick="showTip(event,'${id}')">?</span><span id="${id}" class="tip" style="display:none">${esc(text)}</span>`;
}
function showTip(e,id){
  e.stopPropagation();
  document.querySelectorAll('.tip').forEach(t=>{if(t.id!==id)t.style.display='none'});
  const el=document.getElementById(id);if(!el)return;
  if(el.style.display==='block'){el.style.display='none';return}
  const r=e.target.getBoundingClientRect();
  el.style.display='block';el.style.top=(r.bottom+6)+'px';el.style.right=(window.innerWidth-r.right)+'px';
  setTimeout(()=>document.addEventListener('click',function h(){el.style.display='none';document.removeEventListener('click',h)},10),10);
}
function toast(m,t='ok'){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999';document.body.appendChild(el)}
  el.innerHTML=`<div class="px-5 py-3 rounded-xl font-bold text-sm shadow-lg ${t==='ok'?'bg-p text-white':'bg-red-600 text-white'}">${m}</div>`;
  setTimeout(()=>el.innerHTML='',2500);
}

/* =================================================================
   5) الثيم والحجم والخط
   ================================================================= */
function applyTheme(){
  const t=THEMES[DB.config.theme]||THEMES.emerald;
  const r=document.documentElement.style;
  r.setProperty('--c-primary',t.p);r.setProperty('--c-light',t.l);
  r.setProperty('--c-dark',t.d);r.setProperty('--c-soft',t.s);r.setProperty('--c-bg',t.bg);
}
function applySize(){
  document.body.className=document.body.className.replace(/s-\w+/g,'').trim();
  document.body.classList.add('s-'+(DB.config.uiSize||'medium'));
}
function applyFont(){
  document.documentElement.style.setProperty('--font',`'${DB.config.printFont||'Cairo'}'`);
}
applyTheme();applySize();applyFont();

/* =================================================================
   6) نظام الدخول
   ================================================================= */
let USER=null;
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  if(!user){
    const e=document.getElementById('loginErr');
    e.textContent='❌ بيانات الدخول غير صحيحة';e.classList.remove('hidden');return;
  }
  USER=user;
  sessionStorage.setItem('almasaa_session',user.id);
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userSide').textContent=user.name;
  startApp();
}
function doLogout(){
  if(!confirm('تسجيل الخروج؟'))return;

function computeAlerts(){
  const now=Date.now();
  const r=DB.records.filter(x=>now-x.createdAt<=30*864e5);
  const c={};r.forEach(x=>{c[x.studentId]=(c[x.studentId]||0)+1});
  const out=[];
  Object.entries(c).forEach(([sid,n])=>{
    const s=gS(sid);if(!s)return;
    if(n>=3)out.push({id:sid+'_30',sid,sev:n>=5?'high':'med',title:'تكرار المخالفات',
      msg:`${s.name} (صف ${s.grade}/شعبة ${s.section}) لديه ${n} مخالفة خلال 30 يوماً`});
  });
  return out.filter(a=>!DB.resolved.includes(a.id));
}
function computeFollowups(){
  const now=Date.now();
  return DB.followups.filter(f=>!f.resolved).map(f=>{
    const s=gS(f.studentId);const r=DB.records.find(x=>x.id===f.recordId);
    return {...f,student:s,record:r,days:Math.floor((now-f.createdAt)/864e5)};
  }).filter(f=>f.student&&f.days>=1);
}
function addFollowup(recordId,studentId){
  DB.followups.push({id:uid('F'),recordId,studentId,status:null,note:'',resolved:false,createdAt:Date.now()});
}
function resolveFollowup(id,status,note){
  const f=DB.followups.find(x=>x.id===id);if(!f)return;
  f.status=status;f.note=note||'';f.resolved=true;f.resolvedAt=Date.now();
}
function stuStats(sid){
  const r=DB.records.filter(x=>x.studentId===sid);
  return {count:r.length,points:r.reduce((a,b)=>a+(b.points||0),0)};
}

let BK={enabled:true,interval:10,changes:0,last:0};
try{const b=localStorage.getItem(BK_KEY);if(b)BK=JSON.parse(b)}catch(e){}
function backupTick(){
  BK.changes++;
  localStorage.setItem(BK_KEY,JSON.stringify(BK));
  if(BK.enabled&&BK.changes>=BK.interval)doBackup();
  updateBkUI();
}
function doBackup(){
  try{
    const n=new Date();
    const stamp=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}_${String(n.getHours()).padStart(2,'0')}-${String(n.getMinutes()).padStart(2,'0')}`;
    const content=JSON.stringify({_meta:{school:DB.config.schoolName,at:n.toISOString()},data:DB},null,2);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));
    a.download=`AlMasaa_${stamp}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    BK.changes=0;BK.last=Date.now();localStorage.setItem(BK_KEY,JSON.stringify(BK));
    updateBkUI();toast('💾 نسخة احتياطية');
  }catch(e){toast('فشل النسخ','err')}
}
function restoreBackup(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(!confirm('سيتم استبدال كل البيانات. متابعة؟'))return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const p=JSON.parse(ev.target.result);
        DB=p.data||p;
        localStorage.setItem(KEY,JSON.stringify(DB));
        alert('✅ تم الاستيراد');location.reload();
      }catch(err){alert('ملف غير صالح')}
    };
    r.readAsText(f);
  };
  i.click();
}
function updateBkUI(){
  const el=document.getElementById('bkStatus');if(!el)return;
  const m=BK.last?Math.floor((Date.now()-BK.last)/60000):null;
  const t=m===null?'—':m<1?'الآن':'قبل '+m+' د';
  el.textContent=(BK.enabled?'🟢':'⏸️')+' '+t+' · '+BK.changes+'/'+BK.interval;
}

async function cloudPush(){
  if(!sbClient||CLOUD.syncing)return;
  CLOUD.syncing=true;updateCloudUI('⬆️ رفع...');
  try{
    const {error}=await sbClient.from('app_data').upsert({id:'main',payload:DB,updated_at:new Date().toISOString(),updated_by:USER?USER.name:''});
    CLOUD.last=Date.now();
    updateCloudUI(error?'❌ فشل':'✅ متزامن');
  }catch(e){updateCloudUI('⚠️ خطأ')}
  CLOUD.syncing=false;
}
async function cloudPull(silent){
  if(!sbClient)return false;
  if(!silent)updateCloudUI('⬇️ تحميل...');
  try{
    const {data,error}=await sbClient.from('app_data').select('payload,updated_at').eq('id','main').single();
    if(error||!data||!data.payload)return false;
    DB=data.payload;localStorage.setItem(KEY,JSON.stringify(DB));
    CLOUD.last=new Date(data.updated_at).getTime();
    if(!silent)updateCloudUI('✅ محدّث');
    return true;
  }catch(e){return false}
}

async function sharePDF(html,filename,phone,msg){
  toast('⏳ جاري إنشاء PDF...');
  const ifr=document.createElement('iframe');
  ifr.style.cssText='position:fixed;left:-9999px;top:0;width:800px;height:1200px;border:none';
  document.body.appendChild(ifr);
  const d=ifr.contentDocument;
  d.open();d.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body{font-family:'Cairo',sans-serif;padding:20px;background:white;width:760px;font-size:12pt;color:#000}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px}</style>
    </head><body>${html}</body></html>`);
  d.close();
  await new Promise(r=>setTimeout(r,1500));
  try{
    const canvas=await html2canvas(d.body,{scale:2,useCORS:true,backgroundColor:'#fff',width:760,windowWidth:760});
    const img=canvas.toDataURL('image/png');
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const iw=pw-10,ih=(canvas.height*iw)/canvas.width;
    if(ih<=ph-10){
      pdf.addImage(img,'PNG',5,5,iw,ih);
    } else {
      let remain=ih,offset=0;
      while(remain>0){
        const pageH=Math.min(ph-10,remain);
        const c2=document.createElement('canvas');
        c2.width=canvas.width;
        c2.height=(pageH/ih)*canvas.height;
        const ctx=c2.getContext('2d');
        ctx.drawImage(canvas,0,offset*canvas.height/ih,canvas.width,c2.height,0,0,canvas.width,c2.height);
        pdf.addImage(c2.toDataURL('image/png'),'PNG',5,5,iw,pageH);
        offset+=pageH;remain-=pageH;
        if(remain>0)pdf.addPage();
      }
    }
    const blob=pdf.output('blob');
    const file=new File([blob],filename,{type:'application/pdf'});
    document.body.removeChild(ifr);
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],text:msg||'',title:filename});
        toast('✅ تم فتح قائمة المشاركة');
      }catch(e){
        if(e.name!=='AbortError'){downloadBlob(blob,filename);}
      }
    } else {
      downloadBlob(blob,filename);
      toast('💾 تم تنزيل PDF');
      setTimeout(()=>openWA(phone,msg||''),500);
    }
  }catch(e){
    console.error(e);
    if(ifr.parentNode)document.body.removeChild(ifr);
    toast('فشل إنشاء PDF','err');
  }
}
function downloadBlob(b,f){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=f;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function searchStudent(prefix){
  const dd=document.getElementById(prefix+'Drop');
  const q=document.getElementById(prefix+'Search').value.trim();
  const g=document.getElementById(prefix+'Grade').value;
  const s=document.getElementById(prefix+'Section').value;
  const list=DB.students.filter(x=>{
    if(g&&x.grade!==+g)return false;
    if(s&&x.section!==+s)return false;
    if(q&&!x.name.includes(q))return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'ar')).slice(0,30);
  if(!list.length){dd.innerHTML='<div class="p-4 text-center text-slate-400 text-sm">لا نتائج</div>';dd.classList.remove('hidden');return}
  dd.innerHTML=list.map(x=>{
    let nm=esc(x.name);
    if(q){const i=x.name.indexOf(q);if(i>=0)nm=esc(x.name.slice(0,i))+`<span style="background:#FEF3C7;font-weight:900">${esc(x.name.slice(i,i+q.length))}</span>`+esc(x.name.slice(i+q.length))}
    return `<div class="ditem ${E.sid===x.id?'sel':''}" onclick="selectStudent('${x.id}','${prefix}')">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-bold truncate">${nm}</div>
        <div class="text-xs text-slate-500">صف ${x.grade} · شعبة ${x.section}${x.phone?' · 📞 '+esc(x.phone):''}</div>
      </div>
    </div>`;
  }).join('');
  dd.classList.remove('hidden');
}

function saveRecord(){
  if(!E.sid){toast('اختر الطالب','err');return}
  if(!E.bid){toast('اختر المخالفة','err');return}
  if(!E.aid){toast('اختر الإجراء','err');return}
  const uid=document.getElementById('fUser')?.value||E.uid||DB.users[0]?.id;
  if(!uid){toast('اختر المستخدم','err');return}
  E.uid=uid;
  const b=gB(E.bid),a=gA(E.aid),u=gU(uid);
  DB.followups=DB.followups.filter(f=>f.studentId!==E.sid||f.resolved);
  const rec={
    id:uid0('R'),studentId:E.sid,
    behaviorId:E.bid,behaviorName:b?b.name:'',
    actionId:E.aid,actionName:a?a.name:'',
    userId:uid,userName:u?u.name:'',userTitle:u?u.title:'',
    points:b?b.points:0,note:E.note,actionNote:E.actionNote,
    createdAt:Date.now()
  };
  DB.records.unshift(rec);
  if(a&&/استدعاء|فصل|إحالة/.test(a.name))addFollowup(rec.id,E.sid);
  save();
  toast('✓ تم الحفظ');
  showActions(rec.id);
  E={sid:'',bid:'',aid:'',note:'',uid:DB.users[0]?.id||'',actionNote:''};
  render();
}

function filterRec(){
  return DB.records.filter(r=>{
    const s=gS(r.studentId);if(!s)return false;
    if(RF.q){const x=RF.q.trim();if(!(s.name.includes(x)||(r.behaviorName||'').includes(x)))return false}
    if(RF.grade&&s.grade!==+RF.grade)return false;
    if(RF.section&&s.section!==+RF.section)return false;
    if(RF.from&&r.createdAt<new Date(RF.from).getTime())return false;
    if(RF.to&&r.createdAt>new Date(RF.to).getTime()+864e5)return false;
    return true;
  });
}
function delRecord(id){
  if(!confirm('حذف؟'))return;
  DB.records=DB.records.filter(r=>r.id!==id);
  DB.followups=DB.followups.filter(f=>f.recordId!==id);
  save();render();
}
function exportExcel(){
  const rows=[['التاريخ','الطالب','الصف','الشعبة','المخالفة','النقاط','الإجراء','المستخدم','ملاحظات']];
  filterRec().forEach(r=>{const s=gS(r.studentId);
    rows.push([fmtD(r.createdAt),s?s.name:'',s?s.grade:'',s?s.section:'',r.behaviorName||'',r.points||0,r.actionName||'',r.userName||'',r.actionNote||''])});
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'المخالفات');
  XLSX.writeFile(wb,'سجل_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ---------- التحليل ---------- */
let AF={from:'',to:'',grade:'',section:'',period:'month'};
let charts={};
function setPeriod(p){
  const now=new Date();const end=now.getTime();let st=0;
  if(p==='week')st=end-7*864e5;else if(p==='month')st=end-30*864e5;
  else if(p==='term')st=end-90*864e5;else if(p==='year')st=end-365*864e5;
  AF.period=p;AF.from=st?new Date(st).toISOString().slice(0,10):'';
  AF.to=new Date(end).toISOString().slice(0,10);render();
}
function computeAnalytics(){
  let recs=DB.records.slice();
  if(AF.from)recs=recs.filter(r=>r.createdAt>=new Date(AF.from).getTime());
  if(AF.to)recs=recs.filter(r=>r.createdAt<=new Date(AF.to).getTime()+864e5);
  if(AF.grade)recs=recs.filter(r=>{const s=gS(r.studentId);return s&&s.grade===+AF.grade});
  if(AF.section)recs=recs.filter(r=>{const s=gS(r.studentId);return s&&s.section===+AF.section});
  const bc={};recs.forEach(r=>{const k=r.behaviorName||'—';bc[k]=(bc[k]||0)+1});
  const topBeh=Object.entries(bc).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);
  const gc={};recs.forEach(r=>{const s=gS(r.studentId);if(s)gc[s.grade]=(gc[s.grade]||0)+1});
  const topG=GRADES.map(g=>({grade:g,count:gc[g]||0}));
  const sc={};recs.forEach(r=>{const s=gS(r.studentId);if(!s)return;const k=s.grade+'|'+s.section;
    if(!sc[k])sc[k]={grade:s.grade,section:s.section,count:0};sc[k].count++});
  const topS=Object.values(sc).sort((a,b)=>b.count-a.count);
  const ac={};recs.forEach(r=>{const k=r.actionName||'—';ac[k]=(ac[k]||0)+1});
  const topA=Object.entries(ac).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count);
  const uq={};recs.forEach(r=>{uq[r.studentId]=(uq[r.studentId]||0)+1});
  const topU=Object.entries(uq).map(([sid,c])=>({student:gS(sid),count:c})).filter(x=>x.student).sort((a,b)=>b.count-a.count).slice(0,10);
  return {topBeh,topG,topS,topA,topU,total:recs.length};
}

function drawCharts(){
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};
  const a=computeAnalytics();
  const primary=getComputedStyle(document.documentElement).getPropertyValue('--c-primary').trim()||'#047857';
  const palette=['#047857','#0284C7','#7C3AED','#D97706','#DC2626','#0D9488','#4F46E5','#C026D3'];
  if(document.getElementById('cActions')){
    const t=a.topA.slice(0,6),tt=t.reduce((s,x)=>s+x.count,0)||1;
    charts.actions=new Chart(document.getElementById('cActions'),{
      type:'doughnut',
      data:{labels:t.map(x=>x.name),datasets:[{data:t.map(x=>x.count),backgroundColor:palette,borderWidth:3,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'55%',
        plugins:{legend:{position:'bottom',labels:{font:{family:DB.config.printFont,size:11},padding:8,boxWidth:12}},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed} (${Math.round(c.parsed/tt*100)}%)`}}}}
    });
  }
  if(document.getElementById('cGrades')){
    charts.grades=new Chart(document.getElementById('cGrades'),{
      type:'bar',
      data:{labels:a.topG.map(x=>'صف '+x.grade),datasets:[{label:'العدد',data:a.topG.map(x=>x.count),backgroundColor:primary,borderRadius:8}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y} مخالفة`}}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,precision:0}}}}
    });
  }
  if(document.getElementById('cBeh')){
    const t=a.topBeh.slice(0,7);
    charts.beh=new Chart(document.getElementById('cBeh'),{
      type:'bar',
      data:{labels:t.map(x=>x.name),datasets:[{data:t.map(x=>x.count),backgroundColor:'#DC2626',borderRadius:8}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.x} مرة`}}},scales:{x:{beginAtZero:true,ticks:{stepSize:1,precision:0}}}}
    });

  if(document.getElementById('cSec')){

        <p class="text-xs text-slate-500 mb-2">كل سطر: <b>الاسم، الصف، الشعبة، رقم ولي الأمر</b></p>
        <textarea id="pasteArea" rows="8" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-mono"></textarea>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-bold mb-2">أو ملف Excel</label>
        <input type="file" id="xlsFile" accept=".xlsx,.xls,.csv" class="w-full text-sm">
      </div>
      <div class="mb-4">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="replaceAll"><span>حذف الطلبة الحاليين</span></label>
      </div>
      <div class="flex gap-2">
        <button onclick="doImport()" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">رفع</button>
        <button onclick="this.closest('.modal').remove()" class="px-5 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button>
      </div>
    </div>
  </div>`;
}
function doImport(){
  const p=document.getElementById('pasteArea').value.trim();
  const f=document.getElementById('xlsFile').files[0];
  const rep=document.getElementById('replaceAll').checked;
  const imp=[];
  const parse=line=>{
    const parts=line.split(/[,\t،]/).map(x=>x.trim()).filter(x=>x!=='');
    if(parts.length<3)return null;
    const [n,g,s,ph]=parts;
    const gn=parseInt(g),sn=parseInt(s);
    if(!n||isNaN(gn)||isNaN(sn)||!GRADES.includes(gn))return null;
    return {name:n,grade:gn,section:sn,phone:ph||''};
  };
  if(p)p.split('\n').forEach(l=>{const x=parse(l);if(x)imp.push(x)});
  const process=rows=>{rows.forEach(r=>{
    const [n,g,s,ph]=r.map(x=>String(x==null?'':x).trim());
    const gn=parseInt(g),sn=parseInt(s);
    if(n&&!isNaN(gn)&&!isNaN(sn)&&GRADES.includes(gn))imp.push({name:n,grade:gn,section:sn,phone:ph||''});
  });finish()};
  const finish=()=>{
    if(!imp.length){toast('لا طلبة','err');return}
    if(rep)DB.students=[];
    const ex=new Set(DB.students.map(s=>s.name+'|'+s.grade+'|'+s.section));
    let a=0,sk=0;
    imp.forEach(x=>{
      const k=x.name+'|'+x.grade+'|'+x.section;
      if(ex.has(k)){sk++;return}
      ex.add(k);DB.students.push({id:uid0('S'),...x});a++;
    });
    save();document.getElementById('modals').innerHTML='';
    toast(`✓ ${a} طالب${sk?' (تخطي '+sk+')':''}`);render();
  };
  if(f){
    const r=new FileReader();
    r.onload=e=>{
      try{
        const d=new Uint8Array(e.target.result);
        const wb=XLSX.read(d,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        process(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
      }catch(err){toast('خطأ','err')}
    };
    r.readAsArrayBuffer(f);
  } else finish();
}

function saveUser(id){
  const name=document.getElementById('uN').value.trim();
  const title=document.getElementById('uT').value.trim();
  const username=document.getElementById('uU').value.trim();
  const password=document.getElementById('uP').value;
  const adm=document.getElementById('uA').checked;
  if(!name||!title){toast('أكمل','err');return}
  if(username&&DB.users.some(u=>u.username===username&&u.id!==id)){toast('مستخدم محجوز','err');return}
  if(id){const u=gU(id);Object.assign(u,{name,title,username,password,isAdmin:adm});if(u.id===USER.id)USER=u}
  else DB.users.push({id:uid0('U'),name,title,username,password,isAdmin:adm});
  save();document.getElementById('modals').innerHTML='';toast('✓');render();
}
function delUser(id){
  const u=gU(id);if(!u)return;
  if(u.isAdmin&&DB.users.filter(x=>x.isAdmin).length===1){toast('يجب وجود مدير','err');return}
  if(!confirm('حذف؟'))return;
  DB.users=DB.users.filter(x=>x.id!==id);save();document.getElementById('modals').innerHTML='';render();
}

function fuUI(id,status){
  document.getElementById('modals').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md">
      <h3 class="font-black text-lg mb-4">${status==='yes'?'✓ حضر':status==='no'?'✗ لم يحضر':'📝 ملاحظة'}</h3>
      <div><label class="block text-xs font-bold mb-1">ملاحظات</label>
        <textarea id="fuN" rows="3" class="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm"></textarea></div>
      <div class="flex gap-2 mt-4">
        <button onclick="doFu('${id}','${status}')" class="flex-1 bg-p text-white font-bold py-2.5 rounded-xl">حفظ</button>
        <button onclick="this.closest('.modal').remove()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl">إلغاء</button>
      </div>
    </div>
  </div>`;
}
function doFu(id,status){
  const note=document.getElementById('fuN').value.trim();
  if(status==='note'&&!note){toast('اكتب ملاحظة','err');return}
  const f=DB.followups.find(x=>x.id===id);
  if(status==='note'){f.note=note}
  else{f.status=status;f.note=note;f.resolved=true;f.resolvedAt=Date.now()}
  save();document.getElementById('modals').innerHTML='';toast('✓');render();
}

  DB.config.healthTitle=g('sHT');

  DB.config.healthGreeting=g('sHG');
  DB.config.healthBody=g('sHB');
  DB.config.healthClosing=g('sHC');
  DB.config.healthReturnNote=g('sHNote');

  if(fl){p++;const r=new FileReader();r.onload=e=>{DB.config.logoL=e.target.result;p--;done()};r.readAsDataURL(fl)}
  if(p===0)done();
}

/* =================================================================
   14) Render
   ================================================================= */
function render(){
  const el=document.getElementById('content');
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};
  const m={home:renderHome,entry:renderEntry,records:renderRecords,analytics:renderAnalytics,
    students:renderStudents,health:renderHealth,healthTransfer:renderHealthTransfer,
    healthReport:renderHealthReport,users:renderUsers,behaviors:renderBehaviors,
    actions:renderActions,reports:renderReports,alerts:renderAlerts,settings:renderSettings};
  el.innerHTML=(m[page]||renderHome)();
  if(page==='entry'){updateEntry();if(E.sid){const s=gS(E.sid);if(s){document.getElementById('sSearch').value=s.name;selectStudent(E.sid,'s')}}}
  if(page==='analytics')setTimeout(drawCharts,100);
  window.scrollTo(0,0);
}

/* =================================================================
   15) بدء التشغيل
   ================================================================= */
function startApp(){
  renderNav();
  go('home');
  // مزامنة سحابية
  if(CLOUD.enabled){
    (async()=>{
      const ok=await cloudPull(true);
      if(ok){render();updateCloudUI('✅ متزامن')}
      setInterval(async()=>{if(!CLOUD.syncing&&navigator.onLine){await cloudPull(true);render()}},15000);
    })();
  }
  // Backup indicator
  setInterval(()=>{
    const el=document.getElementById('bkStatus');
    if(!el)return;
    const m=BK.last?Math.floor((Date.now()-BK.last)/60000):null;
    const t=m===null?'—':m<1?'الآن':'قبل '+m+' د';
    el.textContent=(BK.enabled?'🟢':'⏸️')+' '+t+' · '+BK.changes+'/'+BK.interval;
  },10000);
}
// جلسة سابقة
const sess=sessionStorage.getItem('almasaa_session');
if(sess){
  const u=DB.users.find(x=>x.id===sess);
  if(u){
    USER=u;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('userSide').textContent=u.name;
    startApp();
  }
}
